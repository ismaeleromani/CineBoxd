<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CineBoxd Pro - Il social network per cinefili con catalogo TMDB">
  <title>CineBoxd Pro - Catalogo Reale</title>
  <style>
    :root {
      --bg: #14181c;
      --surface: #1d232a;
      --surface-light: #2c3440;
      --text: #9ab;
      --text-white: #ffffff;
      --green: #00e054;
      --green-hover: #00c848;
      --orange: #ff8000;
      --blue: #40bcf4;
      --border: #303840;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }

    /* Header */
    .site-header {
      background: #101418;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-white);
      font-size: 1.6rem;
      font-weight: 900;
      text-decoration: none;
    }
    .logo span { color: var(--text); font-weight: 400; }
    .logo-dots { display: flex; gap: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.green { background: var(--green); }
    .dot.orange { background: var(--orange); }
    .dot.blue { background: var(--blue); }

    .main-nav { display: flex; align-items: center; gap: 1.8rem; }
    .nav-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active { color: var(--text-white); }

    .btn-search-movie {
      background: linear-gradient(135deg, #00e054 0%, #00b341 100%);
      color: #05140a;
      border: none;
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-search-movie:hover { transform: translateY(-2px); }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.8rem;
    }
    .section-header h2 { color: var(--text-white); font-size: 1.8rem; }

    /* Griglia Film */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
    }
    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      border-color: var(--blue);
    }
    .poster-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #222;
    }
    .movie-info {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .movie-title { color: var(--text-white); font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-year { font-size: 0.8rem; color: var(--text); }
    .user-rating { color: var(--green); font-size: 0.85rem; font-weight: bold; }

    /* Modali */
    dialog {
      background: var(--surface);
      color: var(--text-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: min(600px, 92vw);
      margin: auto;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; }

    .search-results-container {
      max-height: 350px;
      overflow-y: auto;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg);
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .search-result-item:hover { border-color: var(--green); }
    .search-result-item img { width: 45px; height: 65px; object-fit: cover; border-radius: 4px; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.85rem; color: var(--text); font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem;
      color: var(--text-white);
    }
    .submit-btn {
      width: 100%;
      background: var(--green);
      color: #05140a;
      border: none;
      border-radius: 6px;
      padding: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 1rem;
    }
    .submit-btn:hover { background: var(--green-hover); }

    footer {
      background: #101418;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2.5rem 1rem;
      margin-top: 4rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-content">
      <a class="logo" href="#" onclick="switchTab('diary')">
        <span class="logo-dots">
          <span class="dot green"></span>
          <span class="dot orange"></span>
          <span class="dot blue"></span>
        </span>
        Cine<span>Boxd</span>
      </a>
      <nav class="main-nav">
        <button class="nav-link active" onclick="switchTab('diary')" id="nav-diary">Il mio Diario</button>
        <button class="nav-link" onclick="switchTab('watchlist')" id="nav-watchlist">Watchlist</button>
      </nav>
      <button class="btn-search-movie" onclick="openSearchModal()">+ Cerca e Logga Film</button>
    </div>
  </header>

  <main class="container" id="main-container">
    <!-- Contenuto dinamico -->
  </main>

  <footer>
    <p>CineBoxd Pro — Dati dei film forniti da <strong>TMDB</strong>.</p>
  </footer>

  <!-- Modal di Ricerca Globale Film Reali -->
  <dialog id="searchModal">
    <div class="modal-header">
      <h2>Cerca un film nel Database Mondiale</h2>
      <button class="modal-close" onclick="document.getElementById('searchModal').close()">&times;</button>
    </div>
    <div class="form-group">
      <input type="text" id="tmdbSearchInput" placeholder="Digita il titolo (es. Avatar, Inception, Il Padrino)..." oninput="searchTMDB(this.value)">
    </div>
    <div class="search-results-container" id="searchResults">
      <p style="color: var(--text); text-align:center; padding: 1rem;">Inizia a digitare per cercare tra milioni di film reali...</p>
    </div>
  </dialog>

  <!-- Modal Recensione / Salvataggio -->
  <dialog id="logModal">
    <div class="modal-header">
      <h2 id="logModalTitle">Aggiungi al Diario</h2>
      <button class="modal-close" onclick="document.getElementById('logModal').close()">&times;</button>
    </div>
    <form id="logForm" onsubmit="saveMovieToDiary(event)">
      <input type="hidden" id="modalMovieId">
      <input type="hidden" id="modalMovieTitle">
      <input type="hidden" id="modalMoviePoster">
      <input type="hidden" id="modalMovieYear">

      <div class="form-group">
        <label>Valutazione (1-5 stelle) *</label>
        <select id="inputRating">
          <option value="5">★★★★★ (5/5)</option>
          <option value="4">★★★★☆ (4/5)</option>
          <option value="3">★★★☆☆ (3/5)</option>
          <option value="2">★★☆☆☆ (2/5)</option>
          <option value="1">★☆☆☆☆ (1/5)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Data di visione *</label>
        <input type="date" id="inputDate" required>
      </div>
      <div class="form-group">
        <label>La tua recensione</label>
        <textarea id="inputReview" rows="3" placeholder="Cosa ne pensi?"></textarea>
      </div>
      <div class="form-group" style="flex-direction: row; align-items: center; gap: 0.5rem;">
        <input type="checkbox" id="inputIsWatchlist" style="width: auto;">
        <label for="inputIsWatchlist" style="margin: 0; cursor: pointer;">Salva in Watchlist (da vedere invece di visto)</label>
      </div>
      <button type="submit" class="submit-btn">Conferma e Salva</button>
    </form>
  </dialog>

  <script>
    // ==========================================
    // INSERISCI QUI LA TUA CHIAVE API DI TMDB (RIGA 209):
    // ==========================================
    const TMDB_API_KEY = '63a7dbdd148130c66875753382f32bd4';
    
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    let userLibrary = JSON.parse(localStorage.getItem('cineboxd_real_db')) || [];
    let currentTab = 'diary';

    function saveLocalStorage() {
      localStorage.setItem('cineboxd_real_db', JSON.stringify(userLibrary));
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
      document.getElementById(`nav-${tab}`).classList.add('active');
      renderApp();
    }

    function renderApp() {
      const container = document.getElementById('main-container');
      const filtered = userLibrary.filter(m => currentTab === 'watchlist' ? m.watchlist : !m.watchlist);

      let html = `
        <div class="section-header">
          <h2>${currentTab === 'watchlist' ? 'La mia Watchlist' : 'Il mio Diario dei Film Visti'}</h2>
          <span style="font-size: 0.9rem; color: var(--text);">${filtered.length} film</span>
        </div>
      `;

      if (filtered.length === 0) {
        html += `
          <div style="text-align: center; padding: 4rem 0; color: var(--text);">
            <h3>La tua lista è vuota</h3>
            <p>Clicca su "+ Cerca e Logga Film" in alto per trovare qualsiasi film esistente al mondo!</p>
          </div>
        `;
      } else {
        html += `<div class="grid">`;
        filtered.forEach(m => {
          html += `
            <div class="movie-card">
              <img class="poster-img" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/200x300?text=No+Poster'}" alt="${m.title}">
              <div class="movie-info">
                <div class="movie-title" title="${m.title}">${m.title}</div>
                <div class="movie-year">${m.year || ''}</div>
                ${!m.watchlist ? `<div class="user-rating">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}</div>` : '<div style="color:var(--orange); font-size:0.8rem;">Da vedere</div>'}
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      container.innerHTML = html;
    }

    function openSearchModal() {
      if (TMDB_API_KEY === 'LA_TUA_API_KEY_QUI') {
        alert("Attenzione: devi inserire la tua chiave API di TMDB nel codice (sostituisci 'LA_TUA_API_KEY_QUI')!");
      }
      document.getElementById('tmdbSearchInput').value = '';
      document.getElementById('searchResults').innerHTML = '<p style="color: var(--text); text-align:center; padding: 1rem;">Digita il titolo di un film...</p>';
      document.getElementById('searchModal').showModal();
    }

    async function searchTMDB(query) {
      if (!query.trim()) {
        document.getElementById('searchResults').innerHTML = '';
        return;
      }
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          resultsContainer.innerHTML = '<p style="color: var(--text); text-align:center; padding: 1rem;">Nessun film trovato.</p>';
          return;
        }

        data.results.forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const poster = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : '';
          
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.innerHTML = `
            <img src="${poster || 'https://via.placeholder.com/45x65?text=No'}" alt="">
            <div>
              <strong style="color:var(--text-white); font-size:0.95rem;">${movie.title}</strong>
              <p style="font-size:0.8rem; color:var(--text);">${year}</p>
            </div>
          `;
          item.onclick = () => selectMovieFromSearch({
            id: movie.id,
            title: movie.title,
            year: year,
            poster: movie.poster_path
          });
          resultsContainer.appendChild(item);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function selectMovieFromSearch(movie) {
      document.getElementById('searchModal').close();
      document.getElementById('modalMovieId').value = movie.id;
      document.getElementById('modalMovieTitle').value = movie.title;
      document.getElementById('modalMoviePoster').value = movie.poster;
      document.getElementById('modalMovieYear').value = movie.year;
      document.getElementById('inputDate').valueAsDate = new Date();
      
      document.getElementById('logModalTitle').textContent = `Aggiungi: ${movie.title} (${movie.year})`;
      document.getElementById('logModal').showModal();
    }

    function saveMovieToDiary(e) {
      e.preventDefault();
      const isWatchlist = document.getElementById('inputIsWatchlist').checked;
      
      const newMovie = {
        id: document.getElementById('modalMovieId').value,
        title: document.getElementById('modalMovieTitle2') ? document.getElementById('modalMovieTitle2').value : document.getElementById('modalMovieTitle').value,
        title: document.getElementById('modalMovieTitle').value,
        year: document.getElementById('modalMovieYear').value,
        poster: document.getElementById('modalMoviePoster').value,
        rating: parseInt(document.getElementById('inputRating').value),
        date: document.getElementById('inputDate').value,
        review: document.getElementById('inputReview').value,
        watchlist: isWatchlist
      };

      userLibrary.unshift(newMovie);
      saveLocalStorage();
      document.getElementById('logModal').close();
      renderApp();
    }

    renderApp();
  </script>
</body>
</html>
