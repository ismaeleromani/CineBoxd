<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CineBoxd Pro - Social Network per Cinefili">
  <title>CineBoxd Pro - Social & Cloud</title>
  
  <!-- Firebase SDKs allineati alla versione 13.2.0 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAfx78JhLPW5D2rvasQjWObB4mSEFAemcQ",
      authDomain: "cineboxd-social.firebaseapp.com",
      projectId: "cineboxd-social",
      storageBucket: "cineboxd-social.firebasestorage.app",
      messagingSenderId: "105455749646",
      appId: "1:105455749646:web:a73453b237d09f9588a5f",
      measurementId: "G-VW9C77S7PP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.fbMethods = {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy
    };
  </script>

  <style>
    :root {
      --bg: #0e1114;
      --surface: #14181c;
      --surface-light: #1d232a;
      --text: #9ab;
      --text-white: #ffffff;
      --green: #00e054;
      --green-hover: #00c848;
      --green-glow: rgba(0, 224, 84, 0.35);
      --orange: #ff8000;
      --blue: #40bcf4;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #2c3440; border-radius: 4px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .site-header {
      background: rgba(16, 20, 24, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-white);
      font-size: 1.6rem;
      font-weight: 900;
      text-decoration: none;
    }
    .logo span { color: var(--text); font-weight: 400; }
    .logo-dots { display: flex; gap: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.green { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }
    .dot.orange { background: var(--orange); }
    .dot.blue { background: var(--blue); }

    .main-nav { display: flex; align-items: center; gap: 1.8rem; }
    .nav-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-link:hover, .nav-link.active { color: var(--text-white); }

    .header-actions { display: flex; align-items: center; gap: 1rem; }
    .btn-log {
      background: linear-gradient(135deg, #00e054 0%, #00b341 100%);
      color: #05140a;
      border: none;
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--green-glow);
      transition: transform 0.2s;
    }
    .btn-log:hover { transform: translateY(-2px); }
    
    .user-badge {
      font-size: 0.8rem;
      color: var(--green);
      background: rgba(0, 224, 84, 0.1);
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      border: 1px solid rgba(0, 224, 84, 0.3);
    }
    .btn-auth-nav {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-white);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-auth-nav:hover { border-color: var(--text-white); }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Hero */
    .hero-stats {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      margin-bottom: 3rem;
      align-items: center;
    }
    .hero-text h1 { color: var(--text-white); font-size: 2.3rem; line-height: 1.15; margin-bottom: 1rem; }
    .hero-text h1 span { color: var(--green); }
    .hero-text p { font-size: 1.05rem; margin-bottom: 1.5rem; }
    
    .stats-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      text-align: center;
    }
    .stat-item .number { color: var(--text-white); font-size: 2rem; font-weight: 800; display: block; }
    .stat-item .label { font-size: 0.75rem; text-transform: uppercase; color: var(--text); }

    /* Cataloghi Home */
    .catalog-section { margin-bottom: 3rem; }
    .catalog-title { color: var(--text-white); font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
    .catalog-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.2rem; }

    .tmdb-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }
    .tmdb-card:hover { transform: translateY(-5px); border-color: var(--green); }
    .tmdb-card img { width: 100%; height: 230px; object-fit: cover; }
    .tmdb-card-info { padding: 0.6rem; }
    .tmdb-card-title { color: var(--text-white); font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tmdb-card-meta { font-size: 0.75rem; color: var(--text); display: flex; justify-content: space-between; margin-top: 0.2rem; }

    /* Griglia Post / Recensioni Globali */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.8rem;
    }
    .section-header h2 { color: var(--text-white); font-size: 1.8rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .movie-card:hover { transform: translateY(-5px); border-color: var(--blue); }
    .poster-img { width: 100%; height: 280px; object-fit: cover; }
    .movie-info { padding: 0.9rem; display: flex; flex-direction: column; gap: 0.4rem; flex-grow: 1; }
    .movie-title { color: var(--text-white); font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-rating { color: var(--green); font-size: 0.85rem; font-weight: 700; }
    .movie-review-snippet { font-size: 0.8rem; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .movie-author { font-size: 0.72rem; color: var(--blue); margin-top: auto; padding-top: 0.5rem; border-top: 1px solid var(--border); }

    /* Modali */
    dialog {
      background: var(--surface-light);
      color: var(--text-white);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      width: min(500px, 92vw);
      margin: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      animation: fadeUp 0.3s ease;
    }
    dialog::backdrop { background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; }

    .search-results-container {
      max-height: 320px;
      overflow-y: auto;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg);
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .search-result-item:hover { border-color: var(--green); }
    .search-result-item img { width: 45px; height: 65px; object-fit: cover; border-radius: 4px; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.85rem; color: var(--text); font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem;
      color: var(--text-white);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .submit-btn {
      width: 100%;
      background: var(--green);
      color: #05140a;
      border: none;
      border-radius: 6px;
      padding: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 1rem;
    }
    .submit-btn:hover { background: var(--green-hover); }

    footer { background: #0a0d10; border-top: 1px solid var(--border); text-align: center; padding: 2.5rem 1rem; margin-top: 4rem; font-size: 0.85rem; }

    @media (max-width: 850px) {
      .hero-stats { grid-template-columns: 1fr; }
      .main-nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-content">
      <a class="logo" href="#home" onclick="switchTab('home')">
        <span class="logo-dots">
          <span class="dot green"></span>
          <span class="dot orange"></span>
          <span class="dot blue"></span>
        </span>
        Cine<span>Boxd</span>
      </a>
      <nav class="main-nav">
        <button class="nav-link active" onclick="switchTab('home')" id="nav-home">Home</button>
        <button class="nav-link" onclick="switchTab('community')" id="nav-community">Feed Community</button>
        <button class="nav-link" onclick="switchTab('myreviews')" id="nav-myreviews">I Miei Film</button>
      </nav>
      <div class="header-actions">
        <button class="btn-log" onclick="openSearchModal()">+ LOG FILM</button>
        <div id="authContainer">
          <button class="btn-auth-nav" onclick="openAuthModal()">Accedi</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Container Principale -->
  <main class="container" id="main-container"></main>

  <footer>
    <p>CineBoxd Pro — Social network per cinefili basato su TMDB e Firebase Cloud.</p>
  </footer>

  <!-- Modal Autenticazione (Login / Registrazione) -->
  <dialog id="authModal">
    <div class="modal-header">
      <h2 id="authTitle">Accedi a CineBoxd</h2>
      <button class="modal-close" onclick="document.getElementById('authModal').close()">&times;</button>
    </div>
    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="authSubmitBtn">Accedi</button>
      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
        <span id="authToggleText">Non hai un account?</span> 
        <a href="#" onclick="toggleAuthMode()" style="color: var(--green); text-decoration: none; font-weight: bold;">Registrati</a>
      </p>
    </form>
  </dialog>

  <!-- Modal Ricerca TMDB -->
  <dialog id="searchModal">
    <div class="modal-header">
      <h2>Cerca un film nel Database Mondiale</h2>
      <button class="modal-close" onclick="document.getElementById('searchModal').close()">&times;</button>
    </div>
    <div class="form-group">
      <input type="text" id="tmdbSearchInput" placeholder="Titolo film (es. Interstellar, Avatar)..." oninput="searchTMDB(this.value)">
    </div>
    <div class="search-results-container" id="searchResults">
      <p style="color: var(--text); text-align:center; padding: 1rem;">Inizia a digitare...</p>
    </div>
  </dialog>

  <!-- Modal Log Film -->
  <dialog id="logModal">
    <div class="modal-header">
      <h2 id="logModalTitle">Condividi Recensione</h2>
      <button class="modal-close" onclick="document.getElementById('logModal').close()">&times;</button>
    </div>
    <form id="logForm" onsubmit="saveMovieToCloud(event)">
      <input type="hidden" id="modalMovieId">
      <input type="hidden" id="modalMovieTitle">
      <input type="hidden" id="modalMoviePoster">
      <input type="hidden" id="modalMovieYear">

      <div class="form-row">
        <div class="form-group">
          <label>Valutazione *</label>
          <select id="inputRating">
            <option value="5">★★★★★ (5/5)</option>
            <option value="4">★★★★☆ (4/5)</option>
            <option value="3">★★★☆☆ (3/5)</option>
            <option value="2">★★☆☆☆ (2/5)</option>
            <option value="1">★☆☆☆☆ (1/5)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data *</label>
          <input type="date" id="inputDate" required>
        </div>
      </div>
      <div class="form-group">
        <label>La tua recensione pubblica</label>
        <textarea id="inputReview" rows="3" placeholder="Scrivi cosa ne pensi per la community..."></textarea>
      </div>
      <button type="submit" class="submit-btn">Pubblica sul Cloud Globale</button>
    </form>
  </dialog>

  <!-- Script principale della logica dell'app -->
  <script>
    const TMDB_API_KEY = '63a7dbdd148130c66875753382f32bd4';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    let currentUser = null;
    let globalReviews = [];
    let currentTab = 'home';
    let isRegistering = false;

    // Monitoraggio stato utente Firebase
    setTimeout(() => {
      window.fbMethods.onAuthStateChanged(window.firebaseAuth, (user) => {
        currentUser = user;
        updateAuthUI();
        loadCloudReviews();
      });
    }, 1000);

    function updateAuthUI() {
      const container = document.getElementById('authContainer');
      if (currentUser) {
        container.innerHTML = `
          <span class="user-badge">${currentUser.email.split('@')[0]}</span>
          <button class="btn-auth-nav" onclick="logoutUser()">Esci</button>
        `;
      } else {
        container.innerHTML = `<button class="btn-auth-nav" onclick="openAuthModal()">Accedi</button>`;
      }
    }

    function openAuthModal() {
      document.getElementById('authModal').showModal();
    }

    function toggleAuthMode() {
      isRegistering = !isRegistering;
      document.getElementById('authTitle').textContent = isRegistering ? 'Registrati a CineBoxd' : 'Accedi a CineBoxd';
      document.getElementById('authSubmitBtn').textContent = isRegistering ? 'Crea Account' : 'Accedi';
      document.getElementById('authToggleText').textContent = isRegistering ? 'Hai già un account?' : "Non hai un account?";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        if (isRegistering) {
          await window.fbMethods.createUserWithEmailAndPassword(window.firebaseAuth, email, pass);
          alert("Registrazione completata con successo!");
        } else {
          await window.fbMethods.signInWithEmailAndPassword(window.firebaseAuth, email, pass);
          alert("Accesso effettuato!");
        }
        document.getElementById('authModal').close();
        document.getElementById('authForm').reset();
      } catch (err) {
        alert("Errore Autenticazione: " + err.message);
      }
    }

    async function logoutUser() {
      await window.fbMethods.signOut(window.firebaseAuth);
      alert("Logout eseguito.");
      renderApp();
    }

    // Carica recensioni globali da Firestore Cloud
    async function loadCloudReviews() {
      try {
        const q = window.fbMethods.query(window.fbMethods.collection(window.firebaseDb, "reviews"), window.fbMethods.orderBy("createdAt", "desc"));
        const querySnapshot = await window.fbMethods.getDocs(q);
        globalReviews = [];
        querySnapshot.forEach((docSnap) => {
          globalReviews.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderApp();
      } catch (e) {
        console.error("Errore caricamento database cloud:", e);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${tab}`);
      if(activeNav) activeNav.classList.add('active');
      renderApp();
    }

    function renderApp() {
      const container = document.getElementById('main-container');
      
      if (currentTab === 'home') {
        const myCount = currentUser ? globalReviews.filter(m => m.userEmail === currentUser.email).length : 0;
        
        container.innerHTML = `
          <section class="hero-stats">
            <div class="hero-text">
              <p style="color:var(--green); text-transform:uppercase; font-size:0.75rem; font-weight:800; letter-spacing:0.15em; margin-bottom:0.5rem;">Social Cinema Network</p>
              <h1>Condividi le tue recensioni con la <span>community globale.</span></h1>
              <p>Esplora i film del momento, scrivi cosa ne pensi e leggi le valutazioni degli altri cinefili in tempo reale.</p>
              <button class="btn-log" onclick="openSearchModal()">+ Registra e Condividi un Film</button>
            </div>
            <div class="stats-card">
              <div class="stat-item">
                <span class="number">${globalReviews.length}</span>
                <span class="label">Recensioni Totali</span>
              </div>
              <div class="stat-item">
                <span class="number">${myCount}</span>
                <span class="label">I tuoi Film</span>
              </div>
            </div>
          </section>

          <div class="catalog-section">
            <div class="catalog-title">🔥 Tendenti della Settimana (TMDB)</div>
            <div class="catalog-row" id="trending-catalog">Caricamento...</div>
          </div>

          ${renderReviewSection("Ultimi Film Recensiti dalla Community", globalReviews.slice(0, 8))}
        `;
        loadHomeCatalogs();

      } else if (currentTab === 'community') {
        container.innerHTML = renderReviewSection("Feed Globale della Community", globalReviews);
      } else if (currentTab === 'myreviews') {
        if (!currentUser) {
          container.innerHTML = `<div style="text-align:center; padding:4rem 0;"><h3>Effettua l'accesso per visualizzare i tuoi film salvati nel cloud.</h3></div>`;
          return;
        }
        const userList = globalReviews.filter(m => m.userEmail === currentUser.email);
        container.innerHTML = renderReviewSection("I Film recensiti da te", userList);
      }
    }

    async function loadHomeCatalogs() {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}&language=it-IT&page=1`);
        const data = await res.json();
        const container = document.getElementById('trending-catalog');
        if(!container) return;
        
        container.innerHTML = '';
        data.results.slice(0, 6).forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const card = document.createElement('div');
          card.className = 'tmdb-card';
          card.innerHTML = `
            <img src="${movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : 'https://via.placeholder.com/200x300'}" alt="${movie.title}">
            <div class="tmdb-card-info">
              <div class="tmdb-card-title">${movie.title}</div>
              <div class="tmdb-card-meta">
                <span>${year}</span>
                <span style="color:var(--orange);">★ ${movie.vote_average.toFixed(1)}</span>
              </div>
            </div>
          `;
          card.onclick = () => selectMovieFromSearch({
            id: movie.id.toString(),
            title: movie.title,
            year: year,
            poster: movie.poster_path
          });
          container.appendChild(card);
        });
      } catch(e) { console.error(e); }
    }

    function renderReviewSection(title, list) {
      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text);">${list.length} recensioni</span>
        </div>
      `;

      if (list.length === 0) {
        html += `<div style="text-align: center; padding: 3rem 0; color: var(--text);"><p>Nessuna recensione trovata.</p></div>`;
      } else {
        html += `<div class="grid">`;
        list.forEach(m => {
          html += `
            <div class="movie-card">
              <img class="poster-img" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/200x300'}" alt="${m.title}">
              <div class="movie-info">
                <div class="movie-title">${m.title} (${m.year})</div>
                <div class="movie-rating">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}</div>
                <p class="movie-review-snippet">${m.review || 'Nessuna nota.'}</p>
                <div class="movie-author">Utente: ${m.userEmail ? m.userEmail.split('@')[0] : 'Anonimo'}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    function openSearchModal() {
      if (!currentUser) {
        alert("Devi effettuare l'accesso per poter registrare e pubblicare recensioni!");
        openAuthModal();
        return;
      }
      document.getElementById('tmdbSearchInput').value = '';
      document.getElementById('searchResults').innerHTML = '<p style="color: var(--text); text-align:center; padding: 1rem;">Digita il titolo...</p>';
      document.getElementById('searchModal').showModal();
    }

    async function searchTMDB(query) {
      if (!query.trim()) return;
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';

        data.results.forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const poster = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : '';
          
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.innerHTML = `
            <img src="${poster || 'https://via.placeholder.com/45x65'}" alt="">
            <div>
              <strong style="color:var(--text-white);">${movie.title}</strong>
              <p style="font-size:0.8rem; color:var(--text);">${year}</p>
            </div>
          `;
          item.onclick = () => {
            document.getElementById('searchModal').close();
            document.getElementById('modalMovieTitle').value = movie.title;
            document.getElementById('modalMoviePoster').value = movie.poster_path || '';
            document.getElementById('modalMovieYear').value = year;
            document.getElementById('inputDate').valueAsDate = new Date();
            document.getElementById('logModal').showModal();
          };
          resultsContainer.appendChild(item);
        });
      } catch (err) { console.error(err); }
    }

    async function saveMovieToCloud(e) {
      e.preventDefault();
      if (!currentUser) return;

      const newReview = {
        title: document.getElementById('modalMovieTitle').value,
        year: document.getElementById('modalMovieYear').value,
        poster: document.getElementById('modalMoviePoster').value,
        rating: parseInt(document.getElementById('inputRating').value),
        date: document.getElementById('inputDate').value,
        review: document.getElementById('inputReview').value,
        userEmail: currentUser.email,
        createdAt: Date.now()
      };

      try {
        await window.fbMethods.addDoc(window.fbMethods.collection(window.firebaseDb, "reviews"), newReview);
        document.getElementById('logModal').close();
        document.getElementById('logForm').reset();
        alert("Recensione pubblicata sul cloud con successo!");
        loadCloudReviews();
      } catch (err) {
        alert("Errore durante il salvataggio: " + err.message);
      }
    }
  </script>
</body>
</html>
