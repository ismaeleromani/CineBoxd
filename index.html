<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CineBoxd Pro - Social Network per Cinefili">
  <title>CineBoxd Pro - Social & Cloud</title>
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAfx78JhLPW5D2rvasQjWObB4mSEFAemcQ",
      authDomain: "cineboxd-social.firebaseapp.com",
      projectId: "cineboxd-social",
      storageBucket: "cineboxd-social.firebasestorage.app",
      messagingSenderId: "105455749646",
      appId: "1:105455749646:web:a73453b237d09f9588a5f",
      measurementId: "G-VW9C77S7PP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.fbMethods = {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      deleteDoc,
      doc,
      updateDoc
    };
  </script>

  <style>
    :root {
      --bg: #080a0c;
      --surface: #12161b;
      --surface-light: #1b2128;
      --surface-hover: #232b35;
      --text: #8c9bae;
      --text-white: #ffffff;
      --green: #00e054;
      --green-hover: #00c848;
      --green-glow: rgba(0, 224, 84, 0.4);
      --orange: #ff8000;
      --blue: #40bcf4;
      --blue-glow: rgba(64, 188, 244, 0.3);
      --red: #ff4757;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #222b36; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--green); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; }

    /* Header Spettacolare */
    .site-header {
      background: rgba(12, 16, 20, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: var(--transition);
    }
    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-white);
      font-size: 1.7rem;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: -0.5px;
      transition: var(--transition);
    }
    .logo:hover { transform: scale(1.02); }
    .logo span { color: var(--text); font-weight: 400; }
    .logo-dots { display: flex; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; transition: var(--transition); }
    .dot.green { background: var(--green); box-shadow: 0 0 10px var(--green-glow); }
    .dot.orange { background: var(--orange); box-shadow: 0 0 10px rgba(255, 128, 0, 0.4); }
    .dot.blue { background: var(--blue); box-shadow: 0 0 10px var(--blue-glow); }

    .main-nav { display: flex; align-items: center; gap: 2rem; }
    .nav-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      padding: 0.5rem 0;
      transition: var(--transition);
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--green);
      transition: var(--transition);
      border-radius: 2px;
    }
    .nav-link:hover { color: var(--text-white); }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    .nav-link.active { color: var(--text-white); }

    .header-actions { display: flex; align-items: center; gap: 1.2rem; }
    .btn-log {
      background: linear-gradient(135deg, #00e054 0%, #00a841 100%);
      color: #05140a;
      border: none;
      border-radius: 30px;
      padding: 0.6rem 1.4rem;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--green-glow);
      transition: var(--transition);
    }
    .btn-log:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 25px rgba(0, 224, 84, 0.6);
    }
    
    .user-badge {
      font-size: 0.8rem;
      color: var(--green);
      background: rgba(0, 224, 84, 0.08);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(0, 224, 84, 0.25);
      font-weight: 600;
    }
    .btn-auth-nav {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-white);
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: var(--transition);
    }
    .btn-auth-nav:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .container { max-width: 1280px; margin: 0 auto; padding: 2.5rem 2rem; }

    /* Hero Spettacolare */
    .hero-stats {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2.5rem;
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-light) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      margin-bottom: 3.5rem;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }
    .hero-stats::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, var(--green-glow) 0%, transparent 70%);
      opacity: 0.5;
      pointer-events: none;
    }
    .hero-text h1 { color: var(--text-white); font-size: 2.5rem; line-height: 1.15; margin-bottom: 1.2rem; font-weight: 800; letter-spacing: -0.5px; }
    .hero-text h1 span { color: var(--green); text-shadow: 0 0 30px var(--green-glow); }
    .hero-text p { font-size: 1.1rem; margin-bottom: 2rem; color: var(--text); }
    
    .stats-card {
      background: rgba(8, 10, 12, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      text-align: center;
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.02);
    }
    .stat-item .number { color: var(--text-white); font-size: 2.2rem; font-weight: 900; display: block; letter-spacing: -1px; }
    .stat-item .label { font-size: 0.75rem; text-transform: uppercase; color: var(--text); letter-spacing: 1px; margin-top: 0.3rem; }

    /* Caroselli Orizzontali Spettacolari */
    .catalog-section { margin-bottom: 3.5rem; }
    .catalog-title { color: var(--text-white); font-size: 1.4rem; font-weight: 800; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px; }
    
    .horizontal-scroll-container {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding: 0.5rem 0.2rem 1.5rem 0.2rem;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .tmdb-card {
      min-width: 180px;
      max-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      flex-shrink: 0;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: var(--transition);
    }
    .tmdb-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--green);
      box-shadow: 0 15px 30px rgba(0, 224, 84, 0.15);
    }
    .tmdb-card img { width: 100%; height: 260px; object-fit: cover; transition: var(--transition); }
    .tmdb-card:hover img { filter: brightness(1.05); }
    .tmdb-card-info { padding: 0.8rem; background: var(--surface); }
    .tmdb-card-title { color: var(--text-white); font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tmdb-card-meta { font-size: 0.75rem; color: var(--text); display: flex; justify-content: space-between; margin-top: 0.3rem; font-weight: 600; }

    /* Sezione Profilo (Sub-tab) */
    .profile-tabs {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem;
    }
    .profile-tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1.6rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .profile-tab-btn:hover {
      background: var(--surface-light);
      color: var(--text-white);
      border-color: var(--border-hover);
    }
    .profile-tab-btn.active {
      background: var(--green);
      color: #05140a;
      border-color: var(--green);
      box-shadow: 0 4px 15px var(--green-glow);
    }

    /* Griglie e Diario */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .section-header h2 { color: var(--text-white); font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.8rem; }
    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: var(--transition);
    }
    .movie-card:hover {
      transform: translateY(-8px);
      border-color: var(--blue);
      box-shadow: 0 15px 35px rgba(64, 188, 244, 0.15);
    }
    .poster-img { width: 100%; height: 320px; object-fit: cover; transition: var(--transition); }
    .movie-card:hover .poster-img { filter: brightness(1.05); }
    .movie-info { padding: 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; background: var(--surface); }
    .movie-title { color: var(--text-white); font-size: 1.05rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-rating { color: var(--green); font-size: 0.9rem; font-weight: 700; text-shadow: 0 0 10px var(--green-glow); }
    .movie-review-snippet { font-size: 0.85rem; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .movie-author { font-size: 0.75rem; color: var(--blue); margin-top: auto; padding-top: 0.8rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }

    /* Diario Personale Spettacolare */
    .diary-list { display: flex; flex-direction: column; gap: 1.2rem; }
    .diary-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      gap: 1.8rem;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transition: var(--transition);
    }
    .diary-item:hover {
      border-color: var(--green);
      transform: translateX(4px);
      box-shadow: 0 12px 30px rgba(0, 224, 84, 0.1);
    }
    .diary-poster { width: 85px; height: 120px; object-fit: cover; border-radius: 8px; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .diary-content { flex-grow: 1; display: flex; flex-direction: column; gap: 0.4rem; }
    .diary-date-badge { font-size: 0.75rem; background: rgba(64, 188, 244, 0.1); color: var(--blue); padding: 0.3rem 0.8rem; border-radius: 6px; width: fit-content; border: 1px solid rgba(64, 188, 244, 0.25); font-weight: 700; }
    .diary-title { color: var(--text-white); font-size: 1.2rem; font-weight: 900; letter-spacing: -0.3px; }
    .diary-review { font-size: 0.95rem; color: var(--text); margin-top: 0.4rem; }
    .btn-delete { background: rgba(255, 71, 87, 0.1); color: var(--red); border: 1px solid rgba(255, 71, 87, 0.3); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 700; transition: var(--transition); }
    .btn-delete:hover { background: var(--red); color: white; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); transform: translateY(-2px); }

    /* Modali con Effetto Vetro Spettacolare */
    dialog {
      background: var(--surface-light);
      color: var(--text-white);
      border: 1px solid var(--border-hover);
      border-radius: 20px;
      padding: 2.5rem;
      width: min(560px, 92vw);
      margin: auto;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      backdrop-filter: blur(20px);
    }
    dialog::backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-header h2 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 2rem; cursor: pointer; transition: var(--transition); }
    .modal-close:hover { color: var(--text-white); transform: scale(1.1); }

    .search-results-container {
      max-height: 350px;
      overflow-y: auto;
      margin-top: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      background: var(--bg);
      padding: 0.7rem;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .search-result-item:hover { border-color: var(--green); background: var(--surface); transform: translateX(4px); }
    .search-result-item img { width: 50px; height: 75px; object-fit: cover; border-radius: 6px; }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.2rem; }
    .form-group label { font-size: 0.85rem; color: var(--text); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: var(--text-white);
      transition: var(--transition);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 15px var(--green-glow);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #00e054 0%, #00a841 100%);
      color: #05140a;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 1.2rem;
      box-shadow: 0 4px 20px var(--green-glow);
      transition: var(--transition);
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 224, 84, 0.6);
    }

    footer { background: #06080a; border-top: 1px solid var(--border); text-align: center; padding: 3rem 1rem; margin-top: 5rem; font-size: 0.85rem; color: var(--text); }

    @media (max-width: 850px) {
      .hero-stats { grid-template-columns: 1fr; padding: 2rem; }
      .main-nav { display: none; }
      .header-content { padding: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Header Spettacolare -->
  <header class="site-header">
    <div class="header-content">
      <a class="logo" href="#home" onclick="switchTab('home')">
        <span class="logo-dots">
          <span class="dot green"></span>
          <span class="dot orange"></span>
          <span class="dot blue"></span>
        </span>
        Cine<span>Boxd</span>
      </a>
      <nav class="main-nav">
        <button class="nav-link active" onclick="switchTab('home')" id="nav-home">Home</button>
        <button class="nav-link" onclick="switchTab('community')" id="nav-community">Feed Community</button>
        <button class="nav-link" onclick="switchTab('profile')" id="nav-profile">Il Mio Profilo</button>
      </nav>
      <div class="header-actions">
        <button class="btn-log" onclick="openSearchModal()">+ LOG FILM</button>
        <div id="authContainer">
          <button class="btn-auth-nav" onclick="openAuthModal()">Accedi</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Container Principale -->
  <main class="container fade-in" id="main-container"></main>

  <footer>
    <p>CineBoxd Pro — Social network per cinefili basato su TMDB e Firebase Cloud. Design Cinematico Avanzato.</p>
  </footer>

  <!-- Modal Autenticazione -->
  <dialog id="authModal">
    <div class="modal-header">
      <h2 id="authTitle">Accedi a CineBoxd</h2>
      <button class="modal-close" onclick="document.getElementById('authModal').close()">&times;</button>
    </div>
    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="authSubmitBtn">Accedi</button>
      <p style="text-align: center; margin-top: 1.2rem; font-size: 0.9rem;">
        <span id="authToggleText">Non hai un account?</span> 
        <a href="#" onclick="toggleAuthMode()" style="color: var(--green); text-decoration: none; font-weight: bold;">Registrati</a>
      </p>
    </form>
  </dialog>

  <!-- Modal Ricerca TMDB -->
  <dialog id="searchModal">
    <div class="modal-header">
      <h2>Cerca un film</h2>
      <button class="modal-close" onclick="document.getElementById('searchModal').close()">&times;</button>
    </div>
    <div class="form-group">
      <input type="text" id="tmdbSearchInput" placeholder="Titolo film (es. Interstellar, Avatar)..." oninput="searchTMDB(this.value)">
    </div>
    <div class="search-results-container" id="searchResults">
      <p style="color: var(--text); text-align:center; padding: 1.5rem;">Inizia a digitare il titolo...</p>
    </div>
  </dialog>

  <!-- Modal Dettagli Film, Trama, Regista & Attori -->
  <dialog id="detailModal">
    <div class="modal-header">
      <h2 id="detMovieTitle" style="font-size: 1.4rem; font-weight: 900;">Titolo Film</h2>
      <button class="modal-close" onclick="document.getElementById('detailModal').close()">&times;</button>
    </div>
    <div id="detMovieModalContent" style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.2rem;">
      <img id="detMoviePoster" src="" alt="" style="width: 130px; height: 190px; object-fit: cover; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); flex-shrink: 0;">
      <div style="flex-grow: 1; min-width: 200px; display: flex; flex-direction: column; gap: 0.5rem;">
        <div id="detMovieGenres" style="font-size: 0.75rem; color: var(--green); font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;"></div>
        <div id="detMovieMeta" style="font-size: 0.85rem; color: var(--text); font-weight: 600;"></div>
        <div id="detMovieDirector" style="font-size: 0.85rem; color: var(--text-white); font-weight: 600;"></div>
        <div id="detMovieCast" style="font-size: 0.8rem; color: var(--text);"></div>
      </div>
    </div>
    <p id="detMovieOverview" style="font-size: 0.9rem; color: var(--text-white); line-height: 1.5; margin-bottom: 1.5rem; max-height: 120px; overflow-y: auto;"></p>
    <div style="display: flex; gap: 1rem;">
      <button type="button" class="submit-btn" style="background: var(--surface); color: var(--text-white); border: 1px solid var(--border);" onclick="document.getElementById('detailModal').close()">Chiudi</button>
      <button type="button" class="submit-btn" id="detActionBtn" onclick="openLogFromDetail()">+ Registra / Log Film</button>
    </div>
  </dialog>

  <!-- Modal Log Film o Watchlist -->
  <dialog id="logModal">
    <div class="modal-header">
      <h2 id="logModalTitle">Aggiungi Film</h2>
      <button class="modal-close" onclick="document.getElementById('logModal').close()">&times;</button>
    </div>
    <form id="logForm" onsubmit="saveMovieToCloud(event)">
      <input type="hidden" id="modalMovieTitle">
      <input type="hidden" id="modalMoviePoster">
      <input type="hidden" id="modalMovieYear">

      <div class="form-group">
        <label>Dove vuoi aggiungere questo film?</label>
        <select id="inputDestination" onchange="toggleFormFields(this.value)">
          <option value="diary">Diario Personale & Feed Pubblico (Visto)</option>
          <option value="watchlist">Watchlist (Da Vedere)</option>
        </select>
      </div>

      <div id="diaryFields">
        <div class="form-row">
          <div class="form-group">
            <label>Valutazione *</label>
            <select id="inputRating">
              <option value="5">★★★★★ (5/5)</option>
              <option value="4">★★★★☆ (4/5)</option>
              <option value="3">★★★☆☆ (3/5)</option>
              <option value="2">★★☆☆☆ (2/5)</option>
              <option value="1">★☆☆☆☆ (1/5)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Data di visione *</label>
            <input type="date" id="inputDate" required>
          </div>
        </div>
        <div class="form-group">
          <label>La tua recensione</label>
          <textarea id="inputReview" rows="3" placeholder="Scrivi cosa ne pensi..."></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="modalSubmitBtn">Salva nel Diario</button>
    </form>
  </dialog>

  <!-- Script principale -->
  <script>
    const TMDB_API_KEY = '63a7dbdd148130c66875753382f32bd4';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    let currentUser = null;
    let globalReviews = [];
    let currentTab = 'home';
    let profileSubTab = 'diary';
    let isRegistering = false;
    let selectedMovieCache = null;

    setTimeout(() => {
      window.fbMethods.onAuthStateChanged(window.firebaseAuth, (user) => {
        currentUser = user;
        updateAuthUI();
        loadCloudReviews();
      });
    }, 1000);

    function updateAuthUI() {
      const container = document.getElementById('authContainer');
      if (currentUser) {
        container.innerHTML = `
          <span class="user-badge">${currentUser.email.split('@')[0]}</span>
          <button class="btn-auth-nav" onclick="logoutUser()">Esci</button>
        `;
      } else {
        container.innerHTML = `<button class="btn-auth-nav" onclick="openAuthModal()">Accedi</button>`;
      }
    }

    function openAuthModal() { document.getElementById('authModal').showModal(); }

    function toggleAuthMode() {
      isRegistering = !isRegistering;
      document.getElementById('authTitle').textContent = isRegistering ? 'Registrati a CineBoxd' : 'Accedi a CineBoxd';
      document.getElementById('authSubmitBtn').textContent = isRegistering ? 'Crea Account' : 'Accedi';
      document.getElementById('authToggleText').textContent = isRegistering ? 'Hai già un account?' : "Non hai un account?";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        if (isRegistering) {
          await window.fbMethods.createUserWithEmailAndPassword(window.firebaseAuth, email, pass);
          alert("Registrazione completata con successo!");
        } else {
          await window.fbMethods.signInWithEmailAndPassword(window.firebaseAuth, email, pass);
          alert("Accesso effettuato!");
        }
        document.getElementById('authModal').close();
        document.getElementById('authForm').reset();
      } catch (err) { alert("Errore Autenticazione: " + err.message); }
    }

    async function logoutUser() {
      await window.fbMethods.signOut(window.firebaseAuth);
      alert("Logout eseguito.");
      renderApp();
    }

    async function loadCloudReviews() {
      try {
        const q = window.fbMethods.query(window.fbMethods.collection(window.firebaseDb, "reviews"), window.fbMethods.orderBy("createdAt", "desc"));
        const querySnapshot = await window.fbMethods.getDocs(q);
        globalReviews = [];
        querySnapshot.forEach((docSnap) => {
          globalReviews.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderApp();
      } catch (e) { console.error("Errore caricamento database cloud:", e); }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${tab}`);
      if(activeNav) activeNav.classList.add('active');
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchProfileSubTab(subTab) {
      profileSubTab = subTab;
      renderApp();
    }

    function renderApp() {
      const container = document.getElementById('main-container');
      
      if (currentTab === 'home') {
        const myCount = currentUser ? globalReviews.filter(m => m.userEmail === currentUser.email && m.type !== 'watchlist').length : 0;
        
        container.innerHTML = `
          <section class="hero-stats">
            <div class="hero-text">
              <p style="color:var(--green); text-transform:uppercase; font-size:0.75rem; font-weight:800; letter-spacing:0.15em; margin-bottom:0.6rem;">Social Cinema Network</p>
              <h1>Condividi le tue recensioni con la <span>community globale.</span></h1>
              <p>Esplora i film del momento, scopri registi, attori, trame dettagliate e gestisci il tuo profilo privato.</p>
              <button class="btn-log" onclick="openSearchModal()">+ Cerca un Film</button>
            </div>
            <div class="stats-card">
              <div class="stat-item">
                <span class="number">${globalReviews.filter(m => m.type !== 'watchlist').length}</span>
                <span class="label">Recensioni Totali</span>
              </div>
              <div class="stat-item">
                <span class="number">${myCount}</span>
                <span class="label">I tuoi Film Visti</span>
              </div>
            </div>
          </section>

          <div class="catalog-section">
            <div class="catalog-title">🔥 Tendenti della Settimana</div>
            <div class="horizontal-scroll-container" id="trending-catalog">Caricamento...</div>
          </div>

          <div class="catalog-section">
            <div class="catalog-title">🚀 Prossimamente in Arrivo</div>
            <div class="horizontal-scroll-container" id="upcoming-catalog">Caricamento...</div>
          </div>

          <div class="catalog-section">
            <div class="catalog-title">💥 Azione & Blockbuster</div>
            <div class="horizontal-scroll-container" id="action-catalog">Caricamento...</div>
          </div>

          <div class="catalog-section">
            <div class="catalog-title">🌌 Fantascienza & Sci-Fi</div>
            <div class="horizontal-scroll-container" id="scifi-catalog">Caricamento...</div>
          </div>

          ${renderReviewSection("Ultimi Film Recensiti dalla Community", globalReviews.filter(m => m.type !== 'watchlist').slice(0, 8))}
        `;
        loadHomeCatalogs();

      } else if (currentTab === 'community') {
        container.innerHTML = renderReviewSection("Feed Globale della Community", globalReviews.filter(m => m.type !== 'watchlist'));
      } else if (currentTab === 'profile') {
        if (!currentUser) {
          container.innerHTML = `<div style="text-align:center; padding:5rem 0;"><h3>Effettua l'accesso per visualizzare il tuo profilo privato.</h3></div>`;
          return;
        }
        
        let profileHtml = `
          <div class="profile-tabs">
            <button class="profile-tab-btn ${profileSubTab === 'diary' ? 'active' : ''}" onclick="switchProfileSubTab('diary')">📖 Diario Personale</button>
            <button class="profile-tab-btn ${profileSubTab === 'watchlist' ? 'active' : ''}" onclick="switchProfileSubTab('watchlist')">📌 Watchlist</button>
          </div>
        `;

        if (profileSubTab === 'diary') {
          const userDiary = globalReviews.filter(m => m.userEmail === currentUser.email && m.type !== 'watchlist');
          profileHtml += renderDiarySection("Il mio Diario Personale dei Film", userDiary);
        } else {
          const userWatchlist = globalReviews.filter(m => m.userEmail === currentUser.email && m.type === 'watchlist');
          profileHtml += renderWatchlistSection("La mia Watchlist (Film da Vedere)", userWatchlist);
        }

        container.innerHTML = profileHtml;
      }
    }

    async function loadHomeCatalogs() {
      fetchTMDBRow(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}&language=it-IT&page=1`, 'trending-catalog');
      fetchTMDBRow(`https://api.themoviedb.org/3/movie/upcoming?api_key=${TMDB_API_KEY}&language=it-IT&page=1`, 'upcoming-catalog');
      fetchTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=28&language=it-IT&page=1`, 'action-catalog');
      fetchTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=878&language=it-IT&page=1`, 'scifi-catalog');
    }

    async function fetchTMDBRow(url, containerId) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById(containerId);
        if(!container) return;
        
        container.innerHTML = '';
        data.results.forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const card = document.createElement('div');
          card.className = 'tmdb-card';
          card.innerHTML = `
            <img src="${movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : 'https://via.placeholder.com/180x260'}" alt="${movie.title}">
            <div class="tmdb-card-info">
              <div class="tmdb-card-title">${movie.title}</div>
              <div class="tmdb-card-meta">
                <span>${year}</span>
                <span style="color:var(--orange);">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/D'}</span>
              </div>
            </div>
          `;
          card.onclick = () => openMovieDetails(movie.id);
          container.appendChild(card);
        });
      } catch(e) { console.error(e); }
    }

    // Carica dettagli, trama, regista e attori tramite apposita chiamata con append_to_response a credits
    async function openMovieDetails(movieId) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${TMDB_API_KEY}&language=it-IT&append_to_response=credits`);
        const movie = await res.json();
        
        selectedMovieCache = {
          id: movie.id,
          title: movie.title,
          year: movie.release_date ? movie.release_date.split('-')[0] : '',
          poster: movie.poster_path,
          overview: movie.overview || "Nessuna trama disponibile in italiano per questo film."
        };

        // Estrai Regista
        let director = "Non disponibile";
        if (movie.credits && movie.credits.crew) {
          const dirObj = movie.credits.crew.find(person => person.job === "Director");
          if (dirObj) director = dirObj.name;
        }

        // Estrai Primi 4 Attori
        let castList = "Non disponibile";
        if (movie.credits && movie.credits.cast) {
          castList = movie.credits.cast.slice(0, 4).map(actor => actor.name).join(', ');
        }

        document.getElementById('detMovieTitle').textContent = `${movie.title} (${selectedMovieCache.year})`;
        document.getElementById('detMoviePoster').src = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : 'https://via.placeholder.com/130x190';
        document.getElementById('detMovieGenres').textContent = movie.genres ? movie.genres.map(g => g.name).join(' • ') : '';
        document.getElementById('detMovieMeta').innerHTML = `⏱️ ${movie.runtime ? movie.runtime + ' min' : 'N/D'} &nbsp;|&nbsp; <span style="color:var(--orange);">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/D'}</span>`;
        document.getElementById('detMovieDirector').innerHTML = `🎬 <strong>Regia:</strong> ${director}`;
        document.getElementById('detMovieCast').innerHTML = `👥 <strong>Cast:</strong> ${castList}`;
        document.getElementById('detMovieOverview').textContent = selectedMovieCache.overview;

        document.getElementById('detailModal').showModal();
      } catch (err) {
        console.error("Errore caricamento dettagli TMDB:", err);
      }
    }

    function openLogFromDetail() {
      if (!currentUser) {
        alert("Devi effettuare l'accesso per poter registrare o aggiungere film!");
        document.getElementById('detailModal').close();
        openAuthModal();
        return;
      }
      document.getElementById('detailModal').close();
      document.getElementById('modalMovieTitle').value = selectedMovieCache.title;
      document.getElementById('modalMoviePoster').value = selectedMovieCache.poster || '';
      document.getElementById('modalMovieYear').value = selectedMovieCache.year;
      document.getElementById('inputDate').valueAsDate = new Date();
      document.getElementById('inputDestination').value = 'diary';
      toggleFormFields('diary');
      document.getElementById('logModal').showModal();
    }

    function renderDiarySection(title, list) {
      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text); font-weight:600;">${list.length} film registrati</span>
        </div>
      `;

      if (list.length === 0) {
        html += `<div style="text-align: center; padding: 4rem 0; color: var(--text);"><p>Il tuo diario è vuoto. Inizia a registrare i film visti!</p></div>`;
      } else {
        html += `<div class="diary-list">`;
        list.forEach(m => {
          html += `
            <div class="diary-item">
              <img class="diary-poster" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/85x120'}" alt="${m.title}">
              <div class="diary-content">
                <span class="diary-date-badge">📅 Visto il: ${m.date || 'Data non specificata'}</span>
                <div class="diary-title">${m.title} (${m.year})</div>
                <div class="movie-rating">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}</div>
                <p class="diary-review">${m.review || 'Nessuna nota personale.'}</p>
              </div>
              <button class="btn-delete" onclick="deleteMovie('${m.id}')">Elimina</button>
            </div>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    function renderWatchlistSection(title, list) {
      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text); font-weight:600;">${list.length} film da vedere</span>
        </div>
      `;

      if (list.length === 0) {
        html += `<div style="text-align: center; padding: 4rem 0; color: var(--text);"><p>La tua Watchlist è vuota. Aggiungi film da vedere in futuro!</p></div>`;
      } else {
        html += `<div class="grid">`;
        list.forEach(m => {
          html += `
            <div class="movie-card">
              <img class="poster-img" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/230x320'}" alt="${m.title}">
              <div class="movie-info">
                <div class="movie-title">${m.title} (${m.year})</div>
                <p class="movie-review-snippet" style="color:var(--blue); font-weight:700;">In Watchlist</p>
                <div class="movie-author">
                  <button class="btn-log" style="padding:0.4rem 0.9rem; font-size:0.75rem;" onclick="moveToDiary('${m.id}', '${m.title.replace(/'/g, "\\'")}', '${m.year}', '${m.poster}')">✓ Visto</button>
                  <button class="btn-delete" onclick="deleteMovie('${m.id}')">Rimuovi</button>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    function renderReviewSection(title, list) {
      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text); font-weight:600;">${list.length} recensioni</span>
        </div>
      `;

      if (list.length === 0) {
        html += `<div style="text-align: center; padding: 4rem 0; color: var(--text);"><p>Nessuna recensione trovata.</p></div>`;
      } else {
        html += `<div class="grid">`;
        list.forEach(m => {
          html += `
            <div class="movie-card">
              <img class="poster-img" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/230x320'}" alt="${m.title}">
              <div class="movie-info">
                <div class="movie-title">${m.title} (${m.year})</div>
                <div class="movie-rating">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}</div>
                <p class="movie-review-snippet">${m.review || 'Nessuna nota.'}</p>
                <div class="movie-author">Utente: ${m.userEmail ? m.userEmail.split('@')[0] : 'Anonimo'}</div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    function openSearchModal() {
      document.getElementById('tmdbSearchInput').value = '';
      document.getElementById('searchResults').innerHTML = '<p style="color: var(--text); text-align:center; padding: 1.5rem;">Digita il titolo...</p>';
      document.getElementById('searchModal').showModal();
    }

    async function searchTMDB(query) {
      if (!query.trim()) return;
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';

        data.results.forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const poster = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : '';
          
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.innerHTML = `
            <img src="${poster || 'https://via.placeholder.com/50x75'}" alt="">
            <div>
              <strong style="color:var(--text-white); font-size: 1rem;">${movie.title}</strong>
              <p style="font-size:0.8rem; color:var(--text);">${year}</p>
            </div>
          `;
          item.onclick = () => {
            document.getElementById('searchModal').close();
            openMovieDetails(movie.id);
          };
          resultsContainer.appendChild(item);
        });
      } catch (err) { console.error(err); }
    }

    function toggleFormFields(destination) {
      const diaryFields = document.getElementById('diaryFields');
      const submitBtn = document.getElementById('modalSubmitBtn');
      if (destination === 'watchlist') {
        diaryFields.style.display = 'none';
        submitBtn.textContent = 'Aggiungi alla Watchlist';
      } else {
        diaryFields.style.display = 'block';
        submitBtn.textContent = 'Salva nel Diario';
      }
    }

    async function saveMovieToCloud(e) {
      e.preventDefault();
      if (!currentUser) return;

      const destination = document.getElementById('inputDestination').value;
      const movieData = {
        title: document.getElementById('modalMovieTitle').value,
        year: document.getElementById('modalMovieYear').value,
        poster: document.getElementById('modalMoviePoster').value,
        type: destination,
        userEmail: currentUser.email,
        createdAt: Date.now()
      };

      if (destination === 'diary') {
        movieData.rating = parseInt(document.getElementById('inputRating').value);
        movieData.date = document.getElementById('inputDate').value;
        movieData.review = document.getElementById('inputReview').value;
      }

      try {
        await window.fbMethods.addDoc(window.fbMethods.collection(window.firebaseDb, "reviews"), movieData);
        document.getElementById('logModal').close();
        document.getElementById('logForm').reset();
        alert(destination === 'watchlist' ? "Film aggiunto alla Watchlist!" : "Film registrato nel Diario con successo!");
        loadCloudReviews();
      } catch (err) { alert("Errore durante il salvataggio: " + err.message); }
    }

    async function deleteMovie(id) {
      if (confirm("Sei sicuro di voler eliminare questo elemento?")) {
        try {
          await window.fbMethods.deleteDoc(window.fbMethods.doc(window.firebaseDb, "reviews", id));
          loadCloudReviews();
        } catch (err) { alert("Errore durante l'eliminazione: " + err.message); }
      }
    }

    async function moveToDiary(id, title, year, poster) {
      try {
        await window.fbMethods.deleteDoc(window.fbMethods.doc(window.firebaseDb, "reviews", id));
        document.getElementById('modalMovieTitle').value = title;
        document.getElementById('modalMoviePoster').value = poster;
        document.getElementById('modalMovieYear').value = year;
        document.getElementById('inputDate').valueAsDate = new Date();
        document.getElementById('inputDestination').value = 'diary';
        toggleFormFields('diary');
        document.getElementById('logModal').showModal();
      } catch (err) { alert("Errore: " + err.message); }
    }
  </script>
</body>
</html>
