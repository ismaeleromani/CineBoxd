<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CineBoxd Pro - Social Network per Cinefili">
  <title>CineBoxd Pro - Social & Cloud</title>
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAfx78JhLPW5D2rvasQjWObB4mSEFAemcQ",
      authDomain: "cineboxd-social.firebaseapp.com",
      projectId: "cineboxd-social",
      storageBucket: "cineboxd-social.firebasestorage.app",
      messagingSenderId: "105455749646",
      appId: "1:105455749646:web:a73453b237d09f9588a5f",
      measurementId: "G-VW9C77S7PP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.firebaseAuth = auth;
    window.firebaseDb = db;
    window.fbMethods = {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      deleteDoc,
      doc,
      updateDoc,
      arrayUnion,
      arrayRemove,
      getDoc,
      setDoc
    };
  </script>

  <style>
    :root {
      --bg: #080a0c;
      --surface: #12161b;
      --surface-light: #1b2128;
      --surface-hover: #232b35;
      --text: #8c9bae;
      --text-white: #ffffff;
      --green: #00e054;
      --green-hover: #00c848;
      --green-glow: rgba(0, 224, 84, 0.4);
      --orange: #ff8000;
      --blue: #40bcf4;
      --blue-glow: rgba(64, 188, 244, 0.3);
      --red: #ff4757;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #222b36; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--green); }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; }

    /* Header */
    .site-header {
      background: rgba(12, 16, 20, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: var(--transition);
    }
    .header-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-white);
      font-size: 1.7rem;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .logo span { color: var(--text); font-weight: 400; }
    .logo-dots { display: flex; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot.green { background: var(--green); box-shadow: 0 0 10px var(--green-glow); }
    .dot.orange { background: var(--orange); }
    .dot.blue { background: var(--blue); }

    /* Barra di Ricerca Globale Header */
    .global-search-bar {
      flex-grow: 1;
      max-width: 400px;
      position: relative;
    }
    .global-search-bar input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.5rem 1rem 0.5rem 2.4rem;
      color: var(--text-white);
      font-size: 0.85rem;
      transition: var(--transition);
    }
    .global-search-bar input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 15px var(--green-glow);
    }
    .global-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .main-nav { display: flex; align-items: center; gap: 1.5rem; flex-shrink: 0; }
    .nav-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      padding: 0.5rem 0;
      transition: var(--transition);
    }
    .nav-link:hover, .nav-link.active { color: var(--text-white); }

    .header-actions { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
    .btn-log {
      background: linear-gradient(135deg, #00e054 0%, #00a841 100%);
      color: #05140a;
      border: none;
      border-radius: 30px;
      padding: 0.5rem 1.2rem;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--green-glow);
      transition: var(--transition);
    }
    .btn-log:hover { transform: translateY(-2px); }
    
    .user-badge {
      font-size: 0.8rem;
      color: var(--green);
      background: rgba(0, 224, 84, 0.08);
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(0, 224, 84, 0.25);
      font-weight: 600;
    }
    .btn-auth-nav {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-white);
      padding: 0.4rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-auth-nav:hover { border-color: var(--border-hover); }

    .container { max-width: 1280px; margin: 0 auto; padding: 2.5rem 2rem; }

    /* Hero */
    .hero-stats {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2.5rem;
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-light) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      margin-bottom: 3.5rem;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .hero-text h1 { color: var(--text-white); font-size: 2.5rem; line-height: 1.15; margin-bottom: 1.2rem; font-weight: 800; }
    .hero-text h1 span { color: var(--green); text-shadow: 0 0 30px var(--green-glow); }
    .hero-text p { font-size: 1.1rem; margin-bottom: 2rem; color: var(--text); }
    
    .stats-card {
      background: rgba(8, 10, 12, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      text-align: center;
    }
    .stat-item .number { color: var(--text-white); font-size: 2.2rem; font-weight: 900; display: block; }
    .stat-item .label { font-size: 0.75rem; text-transform: uppercase; color: var(--text); letter-spacing: 1px; margin-top: 0.3rem; }

    /* Caroselli Orizzontali */
    .catalog-section { margin-bottom: 3.5rem; }
    .catalog-title { color: var(--text-white); font-size: 1.4rem; font-weight: 800; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 10px; }
    
    .horizontal-scroll-container {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding: 0.5rem 0.2rem 1.5rem 0.2rem;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }

    .tmdb-card {
      min-width: 180px;
      max-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      flex-shrink: 0;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: var(--transition);
    }
    .tmdb-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--green); }
    .tmdb-card img { width: 100%; height: 260px; object-fit: cover; }
    .tmdb-card-info { padding: 0.8rem; background: var(--surface); }
    .tmdb-card-title { color: var(--text-white); font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tmdb-card-meta { font-size: 0.75rem; color: var(--text); display: flex; justify-content: space-between; margin-top: 0.3rem; font-weight: 600; }

    /* Profilo */
    .profile-tabs {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem;
    }
    .profile-tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1.6rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .profile-tab-btn:hover { background: var(--surface-light); color: var(--text-white); }
    .profile-tab-btn.active { background: var(--green); color: #05140a; border-color: var(--green); box-shadow: 0 4px 15px var(--green-glow); }

    /* Feed Social */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .section-header h2 { color: var(--text-white); font-size: 1.8rem; font-weight: 800; }

    .feed-list { display: flex; flex-direction: column; gap: 1.5rem; max-width: 800px; margin: 0 auto; }
    .feed-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      gap: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .feed-poster { width: 90px; height: 130px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .feed-content { flex-grow: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .feed-author-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--blue); font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
    .feed-author-bar span { cursor: pointer; }
    .feed-author-bar span:hover { text-decoration: underline; color: var(--text-white); }
    .feed-movie-title { color: var(--text-white); font-size: 1.2rem; font-weight: 900; }
    .feed-review-text { font-size: 0.95rem; color: var(--text-white); margin-top: 0.2rem; }
    
    .social-actions { display: flex; align-items: center; gap: 1.5rem; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); font-size: 0.85rem; }
    .action-btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: 700; transition: var(--transition); }
    .action-btn:hover { color: var(--text-white); }
    .action-btn.liked { color: var(--red); }

    .comments-section { margin-top: 0.8rem; background: var(--bg); padding: 1rem; border-radius: 10px; border: 1px solid var(--border); display: none; }
    .comments-section.open { display: block; }
    .comment-item { font-size: 0.85rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom: 0.4rem; }
    .comment-item strong { color: var(--blue); }
    .comment-form { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
    .comment-input { flex-grow: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.8rem; color: var(--text-white); font-size: 0.85rem; }
    .comment-submit { background: var(--green); color: #05140a; border: none; padding: 0.4rem 0.9rem; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.8rem; }

    /* Diario e Watchlist */
    .diary-list { display: flex; flex-direction: column; gap: 1.2rem; }
    .diary-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      gap: 1.8rem;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    .diary-poster { width: 85px; height: 120px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .diary-content { flex-grow: 1; display: flex; flex-direction: column; gap: 0.4rem; }
    .diary-date-badge { font-size: 0.75rem; background: rgba(64, 188, 244, 0.1); color: var(--blue); padding: 0.3rem 0.8rem; border-radius: 6px; width: fit-content; border: 1px solid rgba(64, 188, 244, 0.25); font-weight: 700; }
    .diary-title { color: var(--text-white); font-size: 1.2rem; font-weight: 900; }
    .btn-delete { background: rgba(255, 71, 87, 0.1); color: var(--red); border: 1px solid rgba(255, 71, 87, 0.3); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
    .btn-delete:hover { background: var(--red); color: white; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.8rem; }
    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .poster-img { width: 100%; height: 320px; object-fit: cover; }
    .movie-info { padding: 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; background: var(--surface); }
    .movie-title { color: var(--text-white); font-size: 1.05rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-author { font-size: 0.75rem; color: var(--blue); margin-top: auto; padding-top: 0.8rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }

    /* Modali */
    dialog {
      background: var(--surface-light);
      color: var(--text-white);
      border: 1px solid var(--border-hover);
      border-radius: 20px;
      padding: 2.5rem;
      width: min(560px, 92vw);
      margin: auto;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
    }
    dialog::backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-header h2 { font-size: 1.4rem; font-weight: 800; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 2rem; cursor: pointer; }

    .search-results-container {
      max-height: 350px;
      overflow-y: auto;
      margin-top: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      background: var(--bg);
      padding: 0.7rem;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .search-result-item:hover { border-color: var(--green); background: var(--surface); }
    .search-result-item img { width: 50px; height: 75px; object-fit: cover; border-radius: 6px; }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.2rem; }
    .form-group label { font-size: 0.85rem; color: var(--text); font-weight: 700; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: var(--text-white);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #00e054 0%, #00a841 100%);
      color: #05140a;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 1.2rem;
      box-shadow: 0 4px 20px var(--green-glow);
    }

    footer { background: #06080a; border-top: 1px solid var(--border); text-align: center; padding: 3rem 1rem; margin-top: 5rem; font-size: 0.85rem; color: var(--text); }

    @media (max-width: 850px) {
      .hero-stats { grid-template-columns: 1fr; padding: 2rem; }
      .main-nav { display: none; }
      .header-content { padding: 1rem; flex-direction: column; align-items: stretch; }
      .global-search-bar { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Header con Barra di Ricerca Universale (Film & Utenti) -->
  <header class="site-header">
    <div class="header-content">
      <a class="logo" href="#home" onclick="switchTab('home')">
        <span class="logo-dots">
          <span class="dot green"></span>
          <span class="dot orange"></span>
          <span class="dot blue"></span>
        </span>
        Cine<span>Boxd</span>
      </a>

      <!-- Barra di ricerca unificata -->
      <div class="global-search-bar">
        <span class="global-search-icon">🔍</span>
        <input type="text" id="globalSearchInput" placeholder="Cerca film o utenti (es. Avatar, @mario)..." oninput="handleGlobalSearch(this.value)">
        <div class="search-results-container" id="globalSearchResults" style="display:none; position:absolute; top:110%; left:0; width:100%; background:var(--surface-light); border:1px solid var(--border); border-radius:12px; z-index:2000; max-height:350px; overflow-y:auto; padding:0.5rem; box-shadow:0 15px 30px rgba(0,0,0,0.8);"></div>
      </div>

      <nav class="main-nav">
        <button class="nav-link active" onclick="switchTab('home')" id="nav-home">Home</button>
        <button class="nav-link" onclick="switchTab('community')" id="nav-community">Feed</button>
        <button class="nav-link" onclick="switchTab('profile')" id="nav-profile">Profilo</button>
      </nav>
      <div class="header-actions">
        <button class="btn-log" onclick="openSearchModal()">+ LOG</button>
        <div id="authContainer">
          <button class="btn-auth-nav" onclick="openAuthModal()">Accedi</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Container Principale -->
  <main class="container fade-in" id="main-container"></main>

  <footer>
    <p>CineBoxd Pro — Social network completo con ricerca universale di film e utenti.</p>
  </footer>

  <!-- Modal Autenticazione -->
  <dialog id="authModal">
    <div class="modal-header">
      <h2 id="authTitle">Accedi a CineBoxd</h2>
      <button class="modal-close" onclick="document.getElementById('authModal').close()">&times;</button>
    </div>
    <form id="authForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="tu@email.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn" id="authSubmitBtn">Accedi</button>
      <p style="text-align: center; margin-top: 1.2rem; font-size: 0.9rem;">
        <span id="authToggleText">Non hai un account?</span> 
        <a href="#" onclick="toggleAuthMode()" style="color: var(--green); text-decoration: none; font-weight: bold;">Registrati</a>
      </p>
    </form>
  </dialog>

  <!-- Modal Ricerca Dedicata (+ LOG) -->
  <dialog id="searchModal">
    <div class="modal-header">
      <h2>Cerca un film da registrare</h2>
      <button class="modal-close" onclick="document.getElementById('searchModal').close()">&times;</button>
    </div>
    <div class="form-group">
      <input type="text" id="tmdbSearchInput" placeholder="Titolo film..." oninput="searchTMDB(this.value)">
    </div>
    <div class="search-results-container" id="searchResults">
      <p style="color: var(--text); text-align:center; padding: 1.5rem;">Inizia a digitare il titolo...</p>
    </div>
  </dialog>

  <!-- Modal Dettagli Film -->
  <dialog id="detailModal">
    <div class="modal-header">
      <h2 id="detMovieTitle" style="font-size: 1.4rem; font-weight: 900;">Titolo Film</h2>
      <button class="modal-close" onclick="document.getElementById('detailModal').close()">&times;</button>
    </div>
    <div id="detMovieModalContent" style="display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.2rem;">
      <img id="detMoviePoster" src="" alt="" style="width: 130px; height: 190px; object-fit: cover; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); flex-shrink: 0;">
      <div style="flex-grow: 1; min-width: 200px; display: flex; flex-direction: column; gap: 0.5rem;">
        <div id="detMovieGenres" style="font-size: 0.75rem; color: var(--green); font-weight: 800; text-transform: uppercase;"></div>
        <div id="detMovieMeta" style="font-size: 0.85rem; color: var(--text); font-weight: 600;"></div>
        <div id="detMovieDirector" style="font-size: 0.85rem; color: var(--text-white); font-weight: 600;"></div>
        <div id="detMovieCast" style="font-size: 0.8rem; color: var(--text);"></div>
      </div>
    </div>
    <p id="detMovieOverview" style="font-size: 0.9rem; color: var(--text-white); line-height: 1.5; margin-bottom: 1.5rem; max-height: 120px; overflow-y: auto;"></p>
    <div style="display: flex; gap: 1rem;">
      <button type="button" class="submit-btn" style="background: var(--surface); color: var(--text-white); border: 1px solid var(--border);" onclick="document.getElementById('detailModal').close()">Chiudi</button>
      <button type="button" class="submit-btn" id="detActionBtn" onclick="openLogFromDetail()">+ Registra / Log Film</button>
    </div>
  </dialog>

  <!-- Modal Log Film o Watchlist -->
  <dialog id="logModal">
    <div class="modal-header">
      <h2 id="logModalTitle">Aggiungi Film</h2>
      <button class="modal-close" onclick="document.getElementById('logModal').close()">&times;</button>
    </div>
    <form id="logForm" onsubmit="saveMovieToCloud(event)">
      <input type="hidden" id="modalMovieTitle">
      <input type="hidden" id="modalMoviePoster">
      <input type="hidden" id="modalMovieYear">

      <div class="form-group">
        <label>Dove vuoi aggiungere questo film?</label>
        <select id="inputDestination" onchange="toggleFormFields(this.value)">
          <option value="diary">Diario Personale & Feed Pubblico (Visto)</option>
          <option value="watchlist">Watchlist (Da Vedere)</option>
        </select>
      </div>

      <div id="diaryFields">
        <div class="form-row">
          <div class="form-group">
            <label>Valutazione *</label>
            <select id="inputRating">
              <option value="5">★★★★★ (5/5)</option>
              <option value="4">★★★★☆ (4/5)</option>
              <option value="3">★★★☆☆ (3/5)</option>
              <option value="2">★★☆☆☆ (2/5)</option>
              <option value="1">★☆☆☆☆ (1/5)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Data di visione *</label>
            <input type="date" id="inputDate" required>
          </div>
        </div>
        <div class="form-group">
          <label>La tua recensione</label>
          <textarea id="inputReview" rows="3" placeholder="Scrivi cosa ne pensi..."></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="modalSubmitBtn">Salva nel Diario</button>
    </form>
  </dialog>

  <!-- Script principale -->
  <script>
    const TMDB_API_KEY = '63a7dbdd148130c66875753382f32bd4';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    let currentUser = null;
    let globalReviews = [];
    let currentTab = 'home';
    let profileSubTab = 'diary';
    let viewingUserEmail = null;
    let isRegistering = false;
    let selectedMovieCache = null;

    setTimeout(() => {
      window.fbMethods.onAuthStateChanged(window.firebaseAuth, (user) => {
        currentUser = user;
        updateAuthUI();
        loadCloudReviews();
      });
    }, 1000);

    function updateAuthUI() {
      const container = document.getElementById('authContainer');
      if (currentUser) {
        container.innerHTML = `
          <span class="user-badge">${currentUser.email.split('@')[0]}</span>
          <button class="btn-auth-nav" onclick="logoutUser()">Esci</button>
        `;
      } else {
        container.innerHTML = `<button class="btn-auth-nav" onclick="openAuthModal()">Accedi</button>`;
      }
    }

    function openAuthModal() { document.getElementById('authModal').showModal(); }

    function toggleAuthMode() {
      isRegistering = !isRegistering;
      document.getElementById('authTitle').textContent = isRegistering ? 'Registrati a CineBoxd' : 'Accedi a CineBoxd';
      document.getElementById('authSubmitBtn').textContent = isRegistering ? 'Crea Account' : 'Accedi';
      document.getElementById('authToggleText').textContent = isRegistering ? 'Hai già un account?' : "Non hai un account?";
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        if (isRegistering) {
          await window.fbMethods.createUserWithEmailAndPassword(window.firebaseAuth, email, pass);
          alert("Registrazione completata con successo!");
        } else {
          await window.fbMethods.signInWithEmailAndPassword(window.firebaseAuth, email, pass);
          alert("Accesso effettuato!");
        }
        document.getElementById('authModal').close();
        document.getElementById('authForm').reset();
      } catch (err) { alert("Errore Autenticazione: " + err.message); }
    }

    async function logoutUser() {
      await window.fbMethods.signOut(window.firebaseAuth);
      alert("Logout eseguito.");
      renderApp();
    }

    async function loadCloudReviews() {
      try {
        const q = window.fbMethods.query(window.fbMethods.collection(window.firebaseDb, "reviews"), window.fbMethods.orderBy("createdAt", "desc"));
        const querySnapshot = await window.fbMethods.getDocs(q);
        globalReviews = [];
        querySnapshot.forEach((docSnap) => {
          globalReviews.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderApp();
      } catch (e) { console.error("Errore caricamento database cloud:", e); }
    }

    function switchTab(tab, userEmail = null) {
      currentTab = tab;
      viewingUserEmail = userEmail;
      document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
      if(tab !== 'externalProfile') {
        const activeNav = document.getElementById(`nav-${tab}`);
        if(activeNav) activeNav.classList.add('active');
      }
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchProfileSubTab(subTab) {
      profileSubTab = subTab;
      renderApp();
    }

    async function renderApp() {
      const container = document.getElementById('main-container');
      
      if (currentTab === 'home') {
        const myCount = currentUser ? globalReviews.filter(m => m.userEmail === currentUser.email && m.type !== 'watchlist').length : 0;
        
        container.innerHTML = `
          <section class="hero-stats">
            <div class="hero-text">
              <p style="color:var(--green); text-transform:uppercase; font-size:0.75rem; font-weight:800; letter-spacing:0.15em; margin-bottom:0.6rem;">Social Cinema Network</p>
              <h1>Condividi le tue recensioni con la <span>community globale.</span></h1>
              <p>Usa la barra di ricerca in alto per trovare film o altri cinefili in tempo reale.</p>
              <button class="btn-log" onclick="openSearchModal()">+ Registra Film</button>
            </div>
            <div class="stats-card">
              <div class="stat-item">
                <span class="number">${globalReviews.filter(m => m.type !== 'watchlist').length}</span>
                <span class="label">Recensioni Totali</span>
              </div>
              <div class="stat-item">
                <span class="number">${myCount}</span>
                <span class="label">I tuoi Film Visti</span>
              </div>
            </div>
          </section>

          <div class="catalog-section">
            <div class="catalog-title">🔥 Tendenti della Settimana</div>
            <div class="horizontal-scroll-container" id="trending-catalog">Caricamento...</div>
          </div>

          <div class="catalog-section">
            <div class="catalog-title">🚀 Prossimamente in Arrivo</div>
            <div class="horizontal-scroll-container" id="upcoming-catalog">Caricamento...</div>
          </div>

          <div class="catalog-section">
            <div class="catalog-title">💥 Azione & Blockbuster</div>
            <div class="horizontal-scroll-container" id="action-catalog">Caricamento...</div>
          </div>

          <div class="catalog-section">
            <div class="catalog-title">🌌 Fantascienza & Sci-Fi</div>
            <div class="horizontal-scroll-container" id="scifi-catalog">Caricamento...</div>
          </div>

          ${renderCommunityFeed("Ultimi Film Recensiti dalla Community", globalReviews.filter(m => m.type !== 'watchlist').slice(0, 8))}
        `;
        loadHomeCatalogs();

      } else if (currentTab === 'community') {
        container.innerHTML = renderCommunityFeed("Feed Globale della Community", globalReviews.filter(m => m.type !== 'watchlist'));
      } else if (currentTab === 'profile') {
        if (!currentUser) {
          container.innerHTML = `<div style="text-align:center; padding:5rem 0;"><h3>Effettua l'accesso per visualizzare il tuo profilo privato.</h3></div>`;
          return;
        }
        
        let profileHtml = `
          <div class="profile-tabs">
            <button class="profile-tab-btn ${profileSubTab === 'diary' ? 'active' : ''}" onclick="switchProfileSubTab('diary')">📖 Diario Personale</button>
            <button class="profile-tab-btn ${profileSubTab === 'watchlist' ? 'active' : ''}" onclick="switchProfileSubTab('watchlist')">📌 Watchlist</button>
          </div>
        `;

        if (profileSubTab === 'diary') {
          const userDiary = globalReviews.filter(m => m.userEmail === currentUser.email && m.type !== 'watchlist');
          profileHtml += renderDiarySection("Il mio Diario Personale dei Film", userDiary, false);
        } else {
          const userWatchlist = globalReviews.filter(m => m.userEmail === currentUser.email && m.type === 'watchlist');
          profileHtml += renderWatchlistSection("La mia Watchlist (Film da Vedere)", userWatchlist);
        }

        container.innerHTML = profileHtml;
      } else if (currentTab === 'externalProfile') {
        container.innerHTML = await renderExternalProfile(viewingUserEmail);
      }
    }

    async function loadHomeCatalogs() {
      fetchTMDBRow(`https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}&language=it-IT&page=1`, 'trending-catalog');
      fetchTMDBRow(`https://api.themoviedb.org/3/movie/upcoming?api_key=${TMDB_API_KEY}&language=it-IT&page=1`, 'upcoming-catalog');
      fetchTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=28&language=it-IT&page=1`, 'action-catalog');
      fetchTMDBRow(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=878&language=it-IT&page=1`, 'scifi-catalog');
    }

    async function fetchTMDBRow(url, containerId) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById(containerId);
        if(!container) return;
        
        container.innerHTML = '';
        data.results.forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const card = document.createElement('div');
          card.className = 'tmdb-card';
          card.innerHTML = `
            <img src="${movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : 'https://via.placeholder.com/180x260'}" alt="${movie.title}">
            <div class="tmdb-card-info">
              <div class="tmdb-card-title">${movie.title}</div>
              <div class="tmdb-card-meta">
                <span>${year}</span>
                <span style="color:var(--orange);">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/D'}</span>
              </div>
            </div>
          `;
          card.onclick = () => openMovieDetails(movie.id);
          container.appendChild(card);
        });
      } catch(e) { console.error(e); }
    }

    async function handleGlobalSearch(queryText) {
      const resultsBox = document.getElementById('globalSearchResults');
      if (!queryText.trim()) {
        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
        return;
      }

      resultsBox.style.display = 'block';
      resultsBox.innerHTML = '<p style="text-align:center; color:var(--text); padding:0.8rem; font-size:0.8rem;">Ricerca in corso...</p>';

      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(queryText)}`);
        const data = await res.json();
        const movieResults = data.results ? data.results.slice(0, 4) : [];

        const uniqueUsers = [...new Set(globalReviews.map(r => r.userEmail))].filter(email => email && email.toLowerCase().includes(queryText.toLowerCase()));

        resultsBox.innerHTML = '';

        if (movieResults.length === 0 && uniqueUsers.length === 0) {
          resultsBox.innerHTML = '<p style="text-align:center; color:var(--text); padding:0.8rem; font-size:0.8rem;">Nessun risultato trovato.</p>';
          return;
        }

        if (uniqueUsers.length > 0) {
          resultsBox.innerHTML += `<div style="font-size:0.7rem; text-transform:uppercase; color:var(--green); font-weight:800; padding:0.4rem 0.6rem; letter-spacing:0.1em;">Utenti Trovati</div>`;
          uniqueUsers.forEach(email => {
            const username = email.split('@')[0];
            const item = document.createElement('div');
            item.className = 'search-result-item';
            item.innerHTML = `
              <div style="width:35px; height:35px; border-radius:50%; background:var(--green); color:#05140a; display:flex; align-items:center; justify-content:center; font-weight:900;">${username[0].toUpperCase()}</div>
              <div>
                <strong style="color:var(--text-white); font-size:0.9rem;">@${username}</strong>
                <p style="font-size:0.75rem; color:var(--text);">Utente CineBoxd</p>
              </div>
            `;
            item.onclick = () => {
              resultsBox.style.display = 'none';
              document.getElementById('globalSearchInput').value = '';
              switchTab('externalProfile', email);
            };
            resultsBox.appendChild(item);
          });
        }

        if (movieResults.length > 0) {
          resultsBox.innerHTML += `<div style="font-size:0.7rem; text-transform:uppercase; color:var(--blue); font-weight:800; padding:0.6rem 0.6rem 0.4rem 0.6rem; letter-spacing:0.1em; border-top:1px solid var(--border); margin-top:0.4rem;">Film (TMDB)</div>`;
          movieResults.forEach(movie => {
            const year = movie.release_date ? movie.release_date.split('-')[0] : '';
            const poster = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : '';
            const item = document.createElement('div');
            item.className = 'search-result-item';
            item.innerHTML = `
              <img src="${poster || 'https://via.placeholder.com/40x60'}" alt="" style="width:35px; height:50px; object-fit:cover; border-radius:4px;">
              <div>
                <strong style="color:var(--text-white); font-size:0.9rem;">${movie.title}</strong>
                <p style="font-size:0.75rem; color:var(--text);">${year}</p>
              </div>
            `;
            item.onclick = () => {
              resultsBox.style.display = 'none';
              document.getElementById('globalSearchInput').value = '';
              openMovieDetails(movie.id);
            };
            resultsBox.appendChild(item);
          });
        }

      } catch (err) { console.error(err); }
    }

    window.addEventListener('click', (e) => {
      const searchBar = document.querySelector('.global-search-bar');
      const resultsBox = document.getElementById('globalSearchResults');
      if (searchBar && resultsBox && !searchBar.contains(e.target)) {
        resultsBox.style.display = 'none';
      }
    });

    async function openMovieDetails(movieId) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}?api_key=${TMDB_API_KEY}&language=it-IT&append_to_response=credits`);
        const movie = await res.json();
        
        selectedMovieCache = {
          id: movie.id,
          title: movie.title,
          year: movie.release_date ? movie.release_date.split('-')[0] : '',
          poster: movie.poster_path,
          overview: movie.overview || "Nessuna trama disponibile."
        };

        let director = "Non disponibile";
        if (movie.credits && movie.credits.crew) {
          const dirObj = movie.credits.crew.find(person => person.job === "Director");
          if (dirObj) director = dirObj.name;
        }

        let castList = "Non disponibile";
        if (movie.credits && movie.credits.cast) {
          castList = movie.credits.cast.slice(0, 4).map(actor => actor.name).join(', ');
        }

        document.getElementById('detMovieTitle').textContent = `${movie.title} (${selectedMovieCache.year})`;
        document.getElementById('detMoviePoster').src = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : 'https://via.placeholder.com/130x190';
        document.getElementById('detMovieGenres').textContent = movie.genres ? movie.genres.map(g => g.name).join(' • ') : '';
        document.getElementById('detMovieMeta').innerHTML = `⏱️ ${movie.runtime ? movie.runtime + ' min' : 'N/D'} &nbsp;|&nbsp; <span style="color:var(--orange);">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/D'}</span>`;
        document.getElementById('detMovieDirector').innerHTML = `🎬 <strong>Regia:</strong> ${director}`;
        document.getElementById('detMovieCast').innerHTML = `👥 <strong>Cast:</strong> ${castList}`;
        document.getElementById('detMovieOverview').textContent = selectedMovieCache.overview;

        document.getElementById('detailModal').showModal();
      } catch (err) { console.error(err); }
    }

    function openLogFromDetail() {
      if (!currentUser) {
        alert("Devi effettuare l'accesso per poter registrare o aggiungere film!");
        document.getElementById('detailModal').close();
        openAuthModal();
        return;
      }
      document.getElementById('detailModal').close();
      document.getElementById('modalMovieTitle').value = selectedMovieCache.title;
      document.getElementById('modalMoviePoster').value = selectedMovieCache.poster || '';
      document.getElementById('modalMovieYear').value = selectedMovieCache.year;
      document.getElementById('inputDate').valueAsDate = new Date();
      document.getElementById('inputDestination').value = 'diary';
      toggleFormFields('diary');
      document.getElementById('logModal').showModal();
    }

    async function renderExternalProfile(targetEmail) {
      const username = targetEmail.split('@')[0];
      const userDiary = globalReviews.filter(m => m.userEmail === targetEmail && m.type !== 'watchlist');
      const userWatchlist = globalReviews.filter(m => m.userEmail === targetEmail && m.type === 'watchlist');

      let isFollowing = false;
      if (currentUser && currentUser.email !== targetEmail) {
        try {
          const userRef = window.fbMethods.doc(window.firebaseDb, "users", currentUser.email);
          const userSnap = await window.fbMethods.getDoc(userRef);
          if (userSnap.exists()) {
            const following = userSnap.data().following || [];
            isFollowing = following.includes(targetEmail);
          }
        } catch (e) { console.error(e); }
      }

      let html = `
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">
          <div>
            <p style="color:var(--green); font-size:0.8rem; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:0.3rem;">Profilo Cinefilo</p>
            <h1 style="color:var(--text-white); font-size: 2.2rem; font-weight:900;">@${username}</h1>
            <p style="color:var(--text); font-size: 0.9rem; margin-top:0.4rem;">${userDiary.length} film visti • ${userWatchlist.length} film in watchlist</p>
          </div>
          ${currentUser && currentUser.email !== targetEmail ? `
            <button class="submit-btn" style="width: auto; padding: 0.7rem 1.8rem; background: ${isFollowing ? 'var(--surface-light)' : 'var(--green)'}; color: ${isFollowing ? 'var(--text-white)' : '#05140a'}; border: 1px solid var(--border);" onclick="toggleFollow('${targetEmail}')">
              ${isFollowing ? '✓ Amici / Seguito' : '+ Richiedi Amicizia / Segui'}
            </button>
          ` : ''}
        </div>
      `;

      html += renderDiarySection(`Diario di @${username}`, userDiary, true);
      return html;
    }

    async function toggleFollow(targetEmail) {
      if (!currentUser) return;
      const userRef = window.fbMethods.doc(window.firebaseDb, "users", currentUser.email);
      try {
        const userSnap = await window.fbMethods.getDoc(userRef);
        let following = [];
        if (userSnap.exists()) {
          following = userSnap.data().following || [];
        }

        if (following.includes(targetEmail)) {
          await window.fbMethods.setDoc(userRef, { following: window.fbMethods.arrayRemove(targetEmail) }, { merge: true });
          alert(`Hai smesso di seguire @${targetEmail.split('@')[0]}`);
        } else {
          await window.fbMethods.setDoc(userRef, { following: window.fbMethods.arrayUnion(targetEmail) }, { merge: true });
          alert(`Richiesta di amicizia accettata! Ora segui @${targetEmail.split('@')[0]}`);
        }
        renderApp();
      } catch (err) { console.error(err); }
    }

    function renderCommunityFeed(title, list) {
      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text); font-weight:600;">${list.length} recensioni</span>
        </div>
      `;

      if (list.length === 0) {
        html += `<div style="text-align: center; padding: 4rem 0; color: var(--text);"><p>Nessuna recensione trovata nella community.</p></div>`;
      } else {
        html += `<div class="feed-list">`;
        list.forEach(m => {
          const likes = m.likes || [];
          const hasLiked = currentUser && likes.includes(currentUser.email);
          const comments = m.comments || [];
          const authorEmail = m.userEmail || '';
          const authorName = authorEmail ? authorEmail.split('@')[0] : 'Anonimo';

          html += `
            <div class="feed-card">
              <img class="feed-poster" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/90x130'}" alt="${m.title}">
              <div class="feed-content">
                <div class="feed-author-bar">
                  <span onclick="switchTab('externalProfile', '${authorEmail}')">@${authorName} (Visualizza Profilo)</span>
                  <span>📅 ${m.date || ''}</span>
                </div>
                <div class="feed-movie-title">${m.title} (${m.year})</div>
                <div style="color:var(--green); font-size:0.9rem;">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}</div>
                <p class="feed-review-text">${m.review || 'Nessuna nota.'}</p>
                
                <div class="social-actions">
                  <button class="action-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLike('${m.id}')">
                    ❤️ <span>${likes.length}</span> Mi piace
                  </button>
                  <button class="action-btn" onclick="toggleCommentsBox('${m.id}')">
                    💬 <span>${comments.length}</span> Commenti
                  </button>
                </div>

                <div class="comments-section" id="comments-${m.id}">
                  <div style="display: flex; flex-direction: column; gap: 0.4rem; max-height: 150px; overflow-y: auto;">
                    ${comments.length === 0 ? '<p style="font-size:0.8rem; color:var(--text);">Nessun commento. Sii il primo a commentare!</p>' : 
                      comments.map(c => `<div class="comment-item"><strong>@${c.user.split('@')[0]}</strong>: ${c.text}</div>`).join('')}
                  </div>
                  <div class="comment-form">
                    <input type="text" class="comment-input" id="comment-input-${m.id}" placeholder="Scrivi un commento...">
                    <button class="comment-submit" onclick="addComment('${m.id}')">Invia</button>
                  </div>
                </div>

              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    async function toggleLike(reviewId) {
      if (!currentUser) {
        alert("Devi effettuare l'accesso per mettere Mi piace!");
        openAuthModal();
        return;
      }
      const ref = window.fbMethods.doc(window.firebaseDb, "reviews", reviewId);
      const snap = await window.fbMethods.getDoc(ref);
      if (!snap.exists()) return;

      const data = snap.data();
      const likes = data.likes || [];
      const hasLiked = likes.includes(currentUser.email);

      try {
        if (hasLiked) {
          await window.fbMethods.updateDoc(ref, { likes: window.fbMethods.arrayRemove(currentUser.email) });
        } else {
          await window.fbMethods.updateDoc(ref, { likes: window.fbMethods.arrayUnion(currentUser.email) });
        }
        loadCloudReviews();
      } catch (err) { console.error(err); }
    }

    function toggleCommentsBox(reviewId) {
      const box = document.getElementById(`comments-${reviewId}`);
      if (box) box.classList.toggle('open');
    }

    async function addComment(reviewId) {
      if (!currentUser) {
        alert("Devi effettuare l'accesso per commentare!");
        openAuthModal();
        return;
      }
      const input = document.getElementById(`comment-input-${reviewId}`);
      const text = input.value.trim();
      if (!text) return;

      const ref = window.fbMethods.doc(window.firebaseDb, "reviews", reviewId);
      const newComment = { user: currentUser.email, text: text, createdAt: Date.now() };

      try {
        await window.fbMethods.updateDoc(ref, { comments: window.fbMethods.arrayUnion(newComment) });
        input.value = '';
        loadCloudReviews();
      } catch (err) { console.error(err); }
    }

    function renderDiarySection(title, list, isExternal = false) {
      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text); font-weight:600;">${list.length} film registrati</span>
        </div>
      `;

      if (list.length === 0) {
        html += `<div style="text-align: center; padding: 4rem 0; color: var(--text);"><p>Nessun film registrato nel diario.</p></div>`;
      } else {
        html += `<div class="diary-list">`;
        list.forEach(m => {
          html += `
            <div class="diary-item">
              <img class="diary-poster" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/85x120'}" alt="${m.title}">
              <div class="diary-content">
                <span class="diary-date-badge">📅 Visto il: ${m.date || 'Data non specificata'}</span>
                <div class="diary-title">${m.title} (${m.year})</div>
                <div style="color:var(--green); font-size:0.9rem;">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}</div>
                <p style="font-size: 0.95rem; color: var(--text);">${m.review || 'Nessuna nota personale.'}</p>
              </div>
              ${!isExternal ? `<button class="btn-delete" onclick="deleteMovie('${m.id}')">Elimina</button>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    function renderWatchlistSection(title, list) {
      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text); font-weight:600;">${list.length} film da vedere</span>
        </div>
      `;

      if (list.length === 0) {
        html += `<div style="text-align: center; padding: 4rem 0; color: var(--text);"><p>La tua Watchlist è vuota.</p></div>`;
      } else {
        html += `<div class="grid">`;
        list.forEach(m => {
          // Uso di data attributes per evitare problemi di sintassi con titoli aventi apici o virgolette
          html += `
            <div class="movie-card">
              <img class="poster-img" src="${m.poster ? IMAGE_BASE_URL + m.poster : 'https://via.placeholder.com/230x320'}" alt="${m.title}">
              <div class="movie-info">
                <div class="movie-title">${m.title} (${m.year})</div>
                <p style="color:var(--blue); font-weight:700; font-size:0.85rem;">In Watchlist</p>
                <div class="movie-author">
                  <button class="btn-log" style="padding:0.4rem 0.9rem; font-size:0.75rem;" 
                          data-id="${m.id}" 
                          data-title="${encodeURIComponent(m.title)}" 
                          data-year="${m.year}" 
                          data-poster="${m.poster || ''}" 
                          onclick="moveToDiaryFromButton(this)">✓ Visto</button>
                  <button class="btn-delete" onclick="deleteMovie('${m.id}')">Rimuovi</button>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      return html;
    }

    function openSearchModal() {
      document.getElementById('tmdbSearchInput').value = '';
      document.getElementById('searchResults').innerHTML = '<p style="color: var(--text); text-align:center; padding: 1.5rem;">Inizia a digitare il titolo...</p>';
      document.getElementById('searchModal').showModal();
    }

    async function searchTMDB(query) {
      if (!query.trim()) return;
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';

        data.results.forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const poster = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : '';
          
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.innerHTML = `
            <img src="${poster || 'https://via.placeholder.com/50x75'}" alt="">
            <div>
              <strong style="color:var(--text-white); font-size: 1rem;">${movie.title}</strong>
              <p style="font-size:0.8rem; color:var(--text);">${year}</p>
            </div>
          `;
          item.onclick = () => {
            document.getElementById('searchModal').close();
            openMovieDetails(movie.id);
          };
          resultsContainer.appendChild(item);
        });
      } catch (err) { console.error(err); }
    }

    function toggleFormFields(destination) {
      const diaryFields = document.getElementById('diaryFields');
      const submitBtn = document.getElementById('modalSubmitBtn');
      if (destination === 'watchlist') {
        diaryFields.style.display = 'none';
        submitBtn.textContent = 'Aggiungi alla Watchlist';
      } else {
        diaryFields.style.display = 'block';
        submitBtn.textContent = 'Salva nel Diario';
      }
    }

    async function saveMovieToCloud(e) {
      e.preventDefault();
      if (!currentUser) return;

      const destination = document.getElementById('inputDestination').value;
      const movieData = {
        title: document.getElementById('modalMovieTitle').value,
        year: document.getElementById('modalMovieYear').value,
        poster: document.getElementById('modalMoviePoster').value,
        type: destination,
        userEmail: currentUser.email,
        createdAt: Date.now(),
        likes: [],
        comments: []
      };

      if (destination === 'diary') {
        movieData.rating = parseInt(document.getElementById('inputRating').value);
        movieData.date = document.getElementById('inputDate').value;
        movieData.review = document.getElementById('inputReview').value;
      }

      try {
        await window.fbMethods.addDoc(window.fbMethods.collection(window.firebaseDb, "reviews"), movieData);
        document.getElementById('logModal').close();
        document.getElementById('logForm').reset();
        alert(destination === 'watchlist' ? "Film aggiunto alla Watchlist!" : "Film registrato nel Diario con successo!");
        loadCloudReviews();
      } catch (err) { alert("Errore durante il salvataggio: " + err.message); }
    }

    async function deleteMovie(id) {
      if (confirm("Sei sicuro di voler eliminare questo elemento?")) {
        try {
          await window.fbMethods.deleteDoc(window.fbMethods.doc(window.firebaseDb, "reviews", id));
          loadCloudReviews();
        } catch (err) { alert("Errore durante l'eliminazione: " + err.message); }
      }
    }

    async function moveToDiaryFromButton(buttonEl) {
      const id = buttonEl.getAttribute('data-id');
      const title = decodeURIComponent(buttonEl.getAttribute('data-title'));
      const year = buttonEl.getAttribute('data-year');
      const poster = buttonEl.getAttribute('data-poster');

      try {
        await window.fbMethods.deleteDoc(window.fbMethods.doc(window.firebaseDb, "reviews", id));
        document.getElementById('modalMovieTitle').value = title;
        document.getElementById('modalMoviePoster').value = poster;
        document.getElementById('modalMovieYear').value = year;
        document.getElementById('inputDate').valueAsDate = new Date();
        document.getElementById('inputDestination').value = 'diary';
        toggleFormFields('diary');
        document.getElementById('logModal').showModal();
      } catch (err) { alert("Errore: " + err.message); }
    }
  </script>
</body>
</html>
