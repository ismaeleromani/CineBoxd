<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CineBoxd Pro - Il tuo diario cinematografico con catalogo TMDB">
  <title>CineBoxd Pro - Il tuo diario cinematografico</title>
  <style>
    :root {
      --bg: #14181c;
      --surface: #1d232a;
      --surface-light: #2c3440;
      --surface-card: #222831;
      --text: #9ab;
      --text-white: #ffffff;
      --green: #00e054;
      --green-hover: #00c848;
      --orange: #ff8000;
      --blue: #40bcf4;
      --border: #303840;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    button, input, select, textarea { font: inherit; }

    /* Header */
    .site-header {
      background: #101418;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-white);
      font-size: 1.6rem;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--text); font-weight: 400; }
    .logo-dots { display: flex; gap: 4px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.green { background: var(--green); }
    .dot.orange { background: var(--orange); }
    .dot.blue { background: var(--blue); }

    .main-nav { display: flex; align-items: center; gap: 1.8rem; }
    .nav-link {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.2s;
      cursor: pointer;
      background: none;
      border: none;
    }
    .nav-link:hover, .nav-link.active { color: var(--text-white); }

    .btn-log {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #00e054 0%, #00b341 100%);
      color: #05140a;
      border: none;
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 224, 84, 0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-log:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 224, 84, 0.4);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Sezione Hero / Stats */
    .hero-stats {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      margin-bottom: 2.5rem;
      align-items: center;
    }
    .hero-text h1 { color: var(--text-white); font-size: 2.5rem; line-height: 1.1; margin-bottom: 1rem; }
    .hero-text h1 span { color: var(--green); }
    .hero-text p { font-size: 1.1rem; margin-bottom: 1.5rem; }
    
    .stats-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      text-align: center;
    }
    .stat-item .number { color: var(--text-white); font-size: 1.8rem; font-weight: 800; display: block; }
    .stat-item .label { font-size: 0.8rem; text-transform: uppercase; color: var(--text); }

    /* Header Sezione */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.8rem;
    }
    .section-header h2 { color: var(--text-white); font-size: 1.8rem; }
    
    /* Toolbar Ricerca & Filtri locale */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .search-box {
      flex: 1;
      min-width: 240px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      padding: 0.6rem 0;
    }
    .toolbar select, .filter-btn {
      padding: 0.6rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-white);
      cursor: pointer;
    }
    .filter-btn.active { border-color: var(--orange); color: var(--orange); }

    /* Griglia Film */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .movie-card:hover {
      transform: translateY(-5px);
      border-color: var(--blue);
    }
    .poster-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: #222;
    }
    .movie-poster-fallback {
      height: 280px;
      background: linear-gradient(135deg, #2c3440 0%, #14181c 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.2rem;
      position: relative;
    }
    .movie-year { font-size: 0.75rem; font-weight: 700; color: var(--green); }
    .movie-title-poster { color: var(--text-white); font-size: 1.4rem; font-weight: 800; line-height: 1.2; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
    .movie-genre-badge { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text); }
    
    .movie-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-grow: 1;
    }
    .movie-title { color: var(--text-white); font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-rating { color: var(--green); font-size: 0.95rem; font-weight: 700; }
    .movie-review-snippet { font-size: 0.85rem; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .movie-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.8rem;
      margin-top: auto;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .action-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text);
    }
    .action-icon-btn.liked { color: var(--orange); }

    /* Modali */
    dialog {
      background: var(--surface);
      color: var(--text-white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      width: min(600px, 92vw);
      margin: auto;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 1.8rem; cursor: pointer; }
    
    .search-results-container {
      max-height: 350px;
      overflow-y: auto;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg);
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .search-result-item:hover { border-color: var(--green); }
    .search-result-item img { width: 45px; height: 65px; object-fit: cover; border-radius: 4px; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.85rem; color: var(--text); font-weight: 600; }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem;
      color: var(--text-white);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .submit-btn {
      width: 100%;
      background: var(--green);
      color: #05140a;
      border: none;
      border-radius: 6px;
      padding: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 1rem;
    }
    .submit-btn:hover { background: var(--green-hover); }

    footer {
      background: #101418;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2.5rem 1rem;
      margin-top: 4rem;
      font-size: 0.85rem;
    }

    @media (max-width: 850px) {
      .hero-stats { grid-template-columns: 1fr; }
      .main-nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-content">
      <a class="logo" href="#home" onclick="switchTab('home')">
        <span class="logo-dots">
          <span class="dot green"></span>
          <span class="dot orange"></span>
          <span class="dot blue"></span>
        </span>
        Cine<span>Boxd</span>
      </a>
      <nav class="main-nav">
        <button class="nav-link active" onclick="switchTab('home')" id="nav-home">Home</button>
        <button class="nav-link" onclick="switchTab('diary')" id="nav-diary">Diario</button>
        <button class="nav-link" onclick="switchTab('movies')" id="nav-movies">Film</button>
        <button class="nav-link" onclick="switchTab('watchlist')" id="nav-watchlist">Watchlist</button>
      </nav>
      <button class="btn-log" onclick="openSearchModal()">
        <span>+</span> LOG FILM
      </button>
    </div>
  </header>

  <!-- Contenuto Principale Dinamico -->
  <main class="container" id="main-container">
    <!-- Iniettato via JavaScript -->
  </main>

  <!-- Footer -->
  <footer>
    <p>CineBoxd Pro — Dati dei film forniti da <strong>TMDB</strong>.</p>
    <p>© 2026 Tutti i diritti riservati</p>
  </footer>

  <!-- Modal di Ricerca Globale TMDB -->
  <dialog id="searchModal">
    <div class="modal-header">
      <h2>Cerca un film nel Database Mondiale</h2>
      <button class="modal-close" onclick="document.getElementById('searchModal').close()">&times;</button>
    </div>
    <div class="form-group">
      <input type="text" id="tmdbSearchInput" placeholder="Digita il titolo (es. Avatar, Interstellar, Il Padrino)..." oninput="searchTMDB(this.value)">
    </div>
    <div class="search-results-container" id="searchResults">
      <p style="color: var(--text); text-align:center; padding: 1rem;">Inizia a digitare per cercare tra milioni di film reali...</p>
    </div>
  </dialog>

  <!-- Modal Recensione / Salvataggio nel Diario -->
  <dialog id="logModal">
    <div class="modal-header">
      <h2 id="logModalTitle">Aggiungi al Diario</h2>
      <button class="modal-close" onclick="document.getElementById('logModal').close()">&times;</button>
    </div>
    <form id="logForm" onsubmit="saveMovieToDiary(event)">
      <input type="hidden" id="modalMovieId">
      <input type="hidden" id="modalMovieTitle">
      <input type="hidden" id="modalMoviePoster">
      <input type="hidden" id="modalMovieYear">
      <input type="hidden" id="modalMovieGenre">

      <div class="form-row">
        <div class="form-group">
          <label>Valutazione (1-5 stelle) *</label>
          <select id="inputRating">
            <option value="5">★★★★★ (5/5)</option>
            <option value="4">★★★★☆ (4/5)</option>
            <option value="3">★★★☆☆ (3/5)</option>
            <option value="2">★★☆☆☆ (2/5)</option>
            <option value="1">★☆☆☆☆ (1/5)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data di visione *</label>
          <input type="date" id="inputDate" required>
        </div>
      </div>
      <div class="form-group">
        <label>La tua recensione / note</label>
        <textarea id="inputReview" rows="3" placeholder="Scrivi cosa ti è piaciuto..."></textarea>
      </div>
      <div class="form-row" style="align-items: center; margin-top: 0.5rem;">
        <label style="display:flex; gap:0.5rem; align-items:center; cursor:pointer;">
          <input type="checkbox" id="inputFavorite" style="width:auto;"> Aggiungi ai Preferiti (♥)
        </label>
        <label style="display:flex; gap:0.5rem; align-items:center; cursor:pointer;">
          <input type="checkbox" id="inputWatchlist" style="width:auto;"> Salva in Watchlist
        </label>
      </div>
      <button type="submit" class="submit-btn">Salva nel Profilo</button>
    </form>
  </dialog>

  <!-- Modal Dettaglio Film -->
  <dialog id="detailModal">
    <div class="modal-header">
      <h2 id="detailTitle">Titolo</h2>
      <button class="modal-close" onclick="document.getElementById('detailModal').close()">&times;</button>
    </div>
    <div id="detailContent"></div>
  </dialog>

  <script>
    // Chiave API TMDB configurata
    const TMDB_API_KEY = '63a7dbdd148130c66875753382f32bd4';
    const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

    let appData = JSON.parse(localStorage.getItem('cineboxd_pro_data')) || [
      { id: '1', title: 'Oltre le stelle', genre: 'Fantascienza', year: 2026, rating: 4, date: '2026-03-10', review: 'Un viaggio incredibile ai confini dello spazio e dell\'animo umano.', favorite: true, watchlist: false, logged: true, poster: '' },
      { id: '2', title: "L'ultima estate", genre: 'Drammatico', year: 2025, rating: 5, date: '2026-02-14', review: 'Intenso, commovente, con una fotografia memorabile.', favorite: true, watchlist: false, logged: true, poster: '' },
      { id: '3', title: 'Blade Runner 2049', genre: 'Fantascienza', year: 2017, rating: 5, date: '2026-01-05', review: 'Capolavoro visivo e narrativo senza tempo.', favorite: false, watchlist: true, logged: false, poster: '' }
    ];

    let currentTab = 'home';
    let searchQuery = '';
    let selectedGenre = 'tutti';
    let onlyFavorites = false;

    function saveData() {
      localStorage.setItem('cineboxd_pro_data', JSON.stringify(appData));
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${tab}`);
      if(activeNav) activeNav.classList.add('active');
      renderApp();
    }

    function renderApp() {
      const container = document.getElementById('main-container');
      
      if (currentTab === 'home') {
        const loggedCount = appData.filter(m => m.logged).length;
        const watchCount = appData.filter(m => m.watchlist).length;
        
        container.innerHTML = `
          <section class="hero-stats">
            <div class="hero-text">
              <p style="color:var(--green); text-transform:uppercase; font-size:0.75rem; font-weight:800; letter-spacing:0.15em; margin-bottom:0.5rem;">Social Cinema Tracker</p>
              <h1>Traccia film, scrivi recensioni e condividi la tua <span>passione.</span></h1>
              <p>Il tuo spazio personale per catalogare ogni visione cinematografica con valutazioni in stelle e note dettagliate.</p>
              <button class="btn-log" onclick="openSearchModal()" style="padding:0.7rem 1.5rem; font-size:0.95rem;">+ Registra un film ora</button>
            </div>
            <div class="stats-card">
              <div class="stat-item">
                <span class="number">${loggedCount}</span>
                <span class="label">Film Visti</span>
              </div>
              <div class="stat-item">
                <span class="number">${watchCount}</span>
                <span class="label">Watchlist</span>
              </div>
            </div>
          </section>

          ${renderMovieSection("Attività Recente e Diario", appData.filter(m => m.logged))}
        `;
      } else if (currentTab === 'diary') {
        container.innerHTML = renderMovieSection("Il mio Diario di Visione", appData.filter(m => m.logged));
      } else if (currentTab === 'movies') {
        container.innerHTML = renderMovieSection("Tutti i Film Archiviati", appData);
      } else if (currentTab === 'watchlist') {
        container.innerHTML = renderMovieSection("La mia Watchlist (Da Vedere)", appData.filter(m => m.watchlist));
      }
      
      attachToolbarListeners();
    }

    function renderMovieSection(title, list) {
      let filtered = list.filter(m => {
        const matchText = m.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchGenre = selectedGenre === 'tutti' || m.genre === selectedGenre;
        const matchFav = !onlyFavorites || m.favorite;
        return matchText && matchGenre && matchFav;
      });

      let html = `
        <div class="section-header">
          <h2>${title}</h2>
          <span style="font-size: 0.9rem; color: var(--text);">${filtered.length} titoli</span>
        </div>

        <div class="toolbar">
          <div class="search-box">
            <span>⌕</span>
            <input type="search" id="searchInput" placeholder="Cerca titolo..." value="${searchQuery}" autocomplete="off">
          </div>
          <select id="genreSelect">
            <option value="tutti" ${selectedGenre === 'tutti' ? 'selected' : ''}>Tutti i generi</option>
            <option value="Fantascienza" ${selectedGenre === 'Fantascienza' ? 'selected' : ''}>Fantascienza</option>
            <option value="Drammatico" ${selectedGenre === 'Drammatico' ? 'selected' : ''}>Drammatico</option>
            <option value="Azione" ${selectedGenre === 'Azione' ? 'selected' : ''}>Azione</option>
            <option value="Thriller" ${selectedGenre === 'Thriller' ? 'selected' : ''}>Thriller</option>
            <option value="Commedia" ${selectedGenre === 'Commedia' ? 'selected' : ''}>Commedia</option>
          </select>
          <button class="filter-btn ${onlyFavorites ? 'active' : ''}" id="favFilterBtn">
            ${onlyFavorites ? '♥ Tutti' : '♥ Preferiti'}
          </button>
        </div>
      `;

      if (filtered.length === 0) {
        html += `
          <div style="text-align: center; padding: 4rem 1rem; color: var(--text);">
            <h3 style="color:var(--text-white); font-size:1.5rem; margin-bottom:0.5rem;">Nessun film trovato</h3>
            <p>Prova a modificare i filtri o premi su <strong>+ LOG FILM</strong> per cercarne uno nuovo dal database mondiale!</p>
          </div>
        `;
      } else {
        html += `<div class="grid">`;
        filtered.forEach(m => {
          const posterHtml = m.poster 
            ? `<img class="poster-img" src="${IMAGE_BASE_URL + m.poster}" alt="${m.title}">`
            : `<div class="movie-poster-fallback">
                <span class="movie-year">${m.year}</span>
                <span class="movie-title-poster">${m.title}</span>
                <span class="movie-genre-badge">${m.genre || 'Film'}</span>
               </div>`;

          html += `
            <div class="movie-card" onclick="openDetail('${m.id}')">
              ${posterHtml}
              <div class="movie-info">
                <div class="movie-title" title="${m.title}">${m.title}</div>
                <div class="movie-rating">${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)} <span>(${m.rating}/5)</span></div>
                <p class="movie-review-snippet">${m.review || 'Nessuna nota inserita.'}</p>
                <div class="movie-card-footer">
                  <span style="font-size:0.75rem; color:var(--text);">${m.logged ? 'Visto il ' + m.date : 'In Watchlist'}</span>
                  <button class="action-icon-btn ${m.favorite ? 'liked' : ''}" onclick="event.stopPropagation(); toggleFavorite('${m.id}')">
                    ${m.favorite ? '♥' : '♡'}
                  </button>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      return html;
    }

    function attachToolbarListeners() {
      const sInput = document.getElementById('searchInput');
      if (sInput) {
        sInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          refreshGridOnly();
        });
      }
      const gSelect = document.getElementById('genreSelect');
      if (gSelect) {
        gSelect.addEventListener('change', (e) => {
          selectedGenre = e.target.value;
          renderApp();
        });
      }
      const fBtn = document.getElementById('favFilterBtn');
      if (fBtn) {
        fBtn.addEventListener('click', () => {
          onlyFavorites = !onlyFavorites;
          renderApp();
        });
      }
    }

    function refreshGridOnly() {
      const activeSearchVal = document.getElementById('searchInput').value;
      searchQuery = activeSearchVal;
      const scrollPos = window.scrollY;
      renderApp();
      document.getElementById('searchInput').focus();
      document.getElementById('searchInput').setSelectionRange(activeSearchVal.length, activeSearchVal.length);
      window.scrollTo(0, scrollPos);
    }

    function toggleFavorite(id) {
      const movie = appData.find(m => m.id === id);
      if (movie) {
        movie.favorite = !movie.favorite;
        saveData();
        renderApp();
      }
    }

    /* Gestione Ricerca TMDB */
    function openSearchModal() {
      document.getElementById('tmdbSearchInput').value = '';
      document.getElementById('searchResults').innerHTML = '<p style="color: var(--text); text-align:center; padding: 1rem;">Inizia a digitare il titolo di un film...</p>';
      document.getElementById('searchModal').showModal();
    }

    async function searchTMDB(query) {
      if (!query.trim()) {
        document.getElementById('searchResults').innerHTML = '';
        return;
      }
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=it-IT&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          resultsContainer.innerHTML = '<p style="color: var(--text); text-align:center; padding: 1rem;">Nessun film trovato su TMDB.</p>';
          return;
        }

        data.results.forEach(movie => {
          const year = movie.release_date ? movie.release_date.split('-')[0] : '';
          const poster = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : '';
          
          const item = document.createElement('div');
          item.className = 'search-result-item';
          item.innerHTML = `
            <img src="${poster || 'https://via.placeholder.com/45x65?text=No'}" alt="">
            <div>
              <strong style="color:var(--text-white); font-size:0.95rem;">${movie.title}</strong>
              <p style="font-size:0.8rem; color:var(--text);">${year}</p>
            </div>
          `;
          item.onclick = () => selectMovieFromSearch({
            id: movie.id.toString(),
            title: movie.title,
            year: year,
            poster: movie.poster_path,
            genre: 'Film'
          });
          resultsContainer.appendChild(item);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function selectMovieFromSearch(movie) {
      document.getElementById('searchModal').close();
      document.getElementById('modalMovieId').value = movie.id;
      document.getElementById('modalMovieTitle').value = movie.title;
      document.getElementById('modalMoviePoster').value = movie.poster;
      document.getElementById('modalMovieYear').value = movie.year;
      document.getElementById('modalMovieGenre').value = movie.genre;
      document.getElementById('inputDate').valueAsDate = new Date();
      
      document.getElementById('logModalTitle').textContent = `Logga: ${movie.title} (${movie.year})`;
      document.getElementById('logModal').showModal();
    }

    function saveMovieToDiary(e) {
      e.preventDefault();
      const isWatchlist = document.getElementById('inputWatchlist').checked;
      
      const newMovie = {
        id: Date.now().toString(),
        title: document.getElementById('modalMovieTitle').value,
        genre: document.getElementById('modalMovieGenre').value || 'Film',
        year: parseInt(document.getElementById('modalMovieYear').value) || 2026,
        poster: document.getElementById('modalMoviePoster').value,
        rating: parseInt(document.getElementById('inputRating').value),
        date: document.getElementById('inputDate').value,
        review: document.getElementById('inputReview').value,
        favorite: document.getElementById('inputFavorite').checked,
        watchlist: isWatchlist,
        logged: !isWatchlist
      };

      appData.unshift(newMovie);
      saveData();
      document.getElementById('logModal').close();
      document.getElementById('logForm').reset();
      renderApp();
    }

    function openDetail(id) {
      const movie = appData.find(m => m.id === id);
      if (!movie) return;

      document.getElementById('detailTitle').textContent = `${movie.title} (${movie.year})`;
      document.getElementById('detailContent').innerHTML = `
        <p style="color: var(--green); font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem;">
          ${'★'.repeat(movie.rating)}${'☆'.repeat(5 - movie.rating)} (${movie.rating}/5)
        </p>
        <p style="font-size: 0.85rem; color: var(--text); margin-bottom: 1rem;">
          Genere: <strong>${movie.genre || 'Film'}</strong> | ${movie.logged ? 'Visto il: ' + movie.date : 'Stato: In Watchlist'}
        </p>
        <p style="background: var(--bg); padding: 1rem; border-radius: 6px; border: 1px solid var(--border); line-height: 1.6; margin-bottom: 1.5rem;">
          ${movie.review || 'Nessuna recensione testuale inserita per questo film.'}
        </p>
        <div style="display: flex; gap: 1rem;">
          <button class="submit-btn" style="background: #303840; color: white;" onclick="deleteMovie('${movie.id}')">Elimina dal diario</button>
        </div>
      `;
      document.getElementById('detailModal').showModal();
    }

    function deleteMovie(id) {
      if (confirm('Vuoi davvero eliminare questo titolo dal tuo diario?')) {
        appData = appData.filter(m => m.id !== id);
        saveData();
        document.getElementById('detailModal').close();
        renderApp();
      }
    }

    renderApp();
  </script>
</body>
</html>
